# Git Branching Workflow Extension Configuration
# Copied to .specify/extensions/git/git-config.yml on install

# Branch numbering strategy: "sequential" (001, 002, ...) or "timestamp" (YYYYMMDD-HHMMSS)
branch_numbering: sequential

# Commit message used by `git commit` during repository initialization
init_commit_message: "chore: initial commit"

# Auto-commit before/after core commands.
#
# Policy for this project:
# - Documentation phases (constitution / specify / clarify / plan / tasks /
#   checklist / analyze) auto-commit with Conventional Commits-formatted
#   static messages. No amend needed.
# - The implement phase stays MANUAL (`enabled: false`) because each
#   implementation commit's content is unique; a static template would be
#   misleading. Run `/speckit-git-commit` manually and write a specific
#   message (or use the manual `git commit` flow). See
#   .claude/projects/.../memory/feedback_speckit_commit_amend.md.
# - before_* hooks stay disabled by default; enable per-need if you want
#   to checkpoint WIP before the next phase runs.
auto_commit:
  default: false

  # ----- before_* hooks: WIP checkpoint before next phase (default off) -----
  before_clarify:
    enabled: false
    message: "chore(wip): checkpoint before clarification"
  before_plan:
    enabled: false
    message: "chore(wip): checkpoint before planning"
  before_tasks:
    enabled: false
    message: "chore(wip): checkpoint before task generation"
  before_implement:
    enabled: false
    message: "chore(wip): checkpoint before implementation"
  before_checklist:
    enabled: false
    message: "chore(wip): checkpoint before checklist"
  before_analyze:
    enabled: false
    message: "chore(wip): checkpoint before analysis"
  before_taskstoissues:
    enabled: false
    message: "chore(wip): checkpoint before issue sync"

  # ----- after_* hooks: documentation phases auto-commit -----
  after_constitution:
    enabled: true
    message: "docs(spec): add project constitution"
  after_specify:
    enabled: true
    message: "docs(spec): add feature specification"
  after_clarify:
    enabled: true
    message: "docs(spec): resolve clarification questions"
  after_plan:
    enabled: true
    message: "docs(spec): add implementation plan"
  after_tasks:
    enabled: true
    message: "docs(spec): add task breakdown"
  after_checklist:
    enabled: true
    message: "docs(spec): add quality checklist"
  after_analyze:
    enabled: true
    message: "docs(spec): add analysis report"
  after_taskstoissues:
    enabled: true
    message: "docs(spec): sync tasks to issues"

  # ----- after_implement: MANUAL — see policy comment above -----
  after_implement:
    enabled: false
    message: "(manual — write a specific message describing the change)"
