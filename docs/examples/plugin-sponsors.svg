            <div class="row fill-width">
              <section class="sponsors">
                <h2 class="field">
                  About Me
                </h2>
                <div class="markdown">
                  <p>
                    Hi! I'm Junya Morioka (@mjun0812), a Machine Learning Engineer in Tokyo with a Ph.D. in Computer Science.
                  </p>
                  <p>
                    I build and maintain open-source tools for ML/AI developers, especially around CUDA, PyTorch, GitHub Actions, and modern Python development environments.
                  </p>
                  <p>
                    My main project is
                    <a href="https://github.com/mjun0812/flash-attention-prebuild-wheels">
                      flash-attention-prebuild-wheels
                    </a>
                    , which provides pre-built Flash Attention 2 and 3 wheels for Linux and Windows. It uses GitHub Actions, self-hosted runners, and AWS CodeBuild to support many CUDA / PyTorch / Python / platform combinations that are not always available officially.
                  </p>
                  <p>
                    I also maintain
                    <a href="https://github.com/mjun0812/setup-cuda">
                      setup-cuda
                    </a>
                    and Python project templates, and I have contributed fixes to OSS projects such as Hugging Face Accelerate / Datasets, YOLOv5, PyTorch, oxc, mirrors-oxfmt, and azooKey Desktop.
                  </p>
                  <p>
                    Sponsorship helps me keep maintaining build infrastructure, release automation, documentation, and user support. If my projects have saved you time or compute resources, I would really appreciate your support.
                  </p>
                  <p>
                    <a href="https://mjunya.com/about/">
                      📝 About Me (JA)
                    </a>
                    <a href="https://mjunya.com/en/about/">
                      📝 About Me (EN)
                    </a>
                  </p>
                </div>
              </section>
            </div>
