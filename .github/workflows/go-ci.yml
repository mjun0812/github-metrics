name: go-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Track the latest stable Go release. Keep in lockstep with the
  # GOLANGCI_LINT_VERSION pin so the lint binary can fully type-check
  # the modules we ship. Pinned to 1.26.5 for the crypto/tls
  # (GO-2026-5856) stdlib fix.
  GO_VERSION: "1.26.5"
  # Built against Go 1.26; matches the runner pin above.
  GOLANGCI_LINT_VERSION: "v2.12.2"

# Job placement: every Linux/x86 job (test / vet / lint / vuln /
# test-race / test-resvg / test-heavy / compliance) runs on the
# GitHub-hosted `ubuntu-latest` runner. Self-hosted runners must not be
# used from a `pull_request`-triggered workflow on a public repository
# — untrusted PR code would execute inside the maintainer's home
# environment. Only smoke-macos stays on a GitHub-hosted macos-latest
# runner (the sole Darwin capacity) — it is temporarily commented out
# below to conserve Actions minutes.
jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go test
        # resvg-dependent tests skip when the binary is absent (covered
        # for real by test-resvg); the rest of the suite runs here.
        run: go test ./...

  vet:
    name: vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go vet
        run: go vet ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.1
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=10m

  vuln:
    name: vuln
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: govulncheck
        run: govulncheck ./...

  test-race:
    name: test-race
    runs-on: ubuntu-latest
    # golang:bookworm provides gcc so the race detector (which requires
    # CGO) works. The k3s runner environment has CGO disabled by default.
    container:
      image: golang:1.26.5-bookworm
    env:
      # Propagates -buildvcs=false to every go command in this job,
      # including the go build call inside tests/integration TestMain,
      # which runs as a child process and does not inherit CLI flags.
      GOFLAGS: -buildvcs=false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go test -race
        run: go test -race ./...

  test-resvg:
    name: test-resvg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # resvg publishes a prebuilt linux/x86_64 binary; CI is amd64-only
      # so curl it (much faster than the `cargo install` the Docker image
      # uses for multi-arch) and verify the pinned checksum before trusting
      # it. The rasterizer-dependent Go tests skip when the binary is
      # absent, so this job is what actually exercises the resvg path.
      - name: install resvg
        run: |
          set -euo pipefail
          RESVG_VERSION=0.47.0
          RESVG_SHA256=5c84dcbcd032fe7e8d96e616fd6807a2f9df6561d2e6582b37e91e63c6cb4fe7
          curl -fsSL -o resvg.tar.gz \
            "https://github.com/linebender/resvg/releases/download/v${RESVG_VERSION}/resvg-linux-x86_64.tar.gz"
          echo "${RESVG_SHA256}  resvg.tar.gz" | sha256sum -c -
          tar xzf resvg.tar.gz
          mkdir -p "$HOME/.local/bin"
          install -m 0755 resvg "$HOME/.local/bin/resvg"
          echo "METRICS_RESVG_PATH=$HOME/.local/bin/resvg" >> "$GITHUB_ENV"
      # The ARC runner pod ships no fonts, so resvg would skip every
      # <text> and tests/visual's non-transparent-ratio floor trips.
      # Reuse the Liberation Sans files already embedded for Go-side
      # measurement (internal/render/fontmetrics) — resvg scans
      # ~/.local/share/fonts, and using the identical TTFs keeps the
      # raster deterministic against the measurement font.
      - name: install fonts for resvg
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/fonts"
          cp internal/render/fontmetrics/fonts/LiberationSans-*.ttf "$HOME/.local/share/fonts/"
      # Run only the rasterizer-dependent tests here; the default `test`
      # job already covers the rest of the suite (where they skip).
      - name: go test (resvg)
        run: |
          go test ./internal/render -run 'Resvg|ApplyPadding'
          go test ./tests/integration -run 'Resvg'
          go test ./tests/visual

  test-heavy:
    name: test-heavy
    runs-on: ubuntu-latest
    # `heavy` build tag covers M4 plugins that pull in go-enry's
    # embedded language database and go-git's shallow clone path
    # (languages.recent, languages.indepth). Both are pure Go; we just
    # want the wall-time cost off the default `test` job. Parallel with
    # `test` + `test-resvg`.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go test -tags=heavy
        run: |
          go test -tags=heavy ./internal/plugins/languages -run 'Test(RecentRun_|Indepth_)'
          go test -tags=heavy ./tests/integration -run 'TestCompute(SVG|JSON)_P3HeavyAllPlugins'

  compliance:
    name: compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: compliance (no unadopted plugin refs, no removed sentinels, org_repo ignored)
        run: go test ./tests/compliance/...

  # smoke-macos is temporarily disabled to conserve GitHub-hosted
  # Actions minutes (macos-latest burns them at a 10x multiplier).
  # Re-enable by uncommenting once the rate-limit pressure subsides.
  #
  # smoke-macos:
  #   name: smoke-macos
  #   runs-on: macos-latest
  #   steps:
  #     - uses: actions/checkout@v5
  #     - uses: actions/setup-go@v6
  #       with:
  #         go-version: ${{ env.GO_VERSION }}
  #         cache: true
  #     - name: go build
  #       run: go build ./...
  #     - name: go test (config subset, run when packages exist)
  #       run: |
  #         if [ -d internal/config ]; then
  #           go test ./internal/config/...
  #         else
  #           echo "internal/config not present yet; smoke build only"
  #         fi
