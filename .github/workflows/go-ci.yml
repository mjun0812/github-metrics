name: go-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Track the latest stable Go release. Keep in lockstep with the
  # GOLANGCI_LINT_VERSION pin so the lint binary can fully type-check
  # the modules we ship.
  GO_VERSION: "1.26.3"
  # Built against Go 1.26; matches the runner pin above.
  GOLANGCI_LINT_VERSION: "v2.12.2"

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go test
        run: go test ./...

  vet:
    name: vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go vet
        run: go vet ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=10m

  vuln:
    name: vuln
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: govulncheck
        run: govulncheck ./...

  test-race:
    name: test-race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go test -race
        run: go test -race ./...

  test-chromedp:
    name: test-chromedp
    runs-on: ubuntu-latest
    container:
      image: chromedp/headless-shell:latest
    env:
      METRICS_CHROME_PATH: /headless-shell/headless-shell
    steps:
      # The chromedp/headless-shell image is minimal and ships
      # without `make` or `ca-certificates`. apt-get is available
      # because the base is debian-slim; install the cert bundle so
      # `go mod download` can verify the GoSumDB / proxy TLS chain.
      - name: Install CA certificates
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # `-tags=chromedp` is what the Makefile target sets too; the
      # Makefile is unused here because the image lacks `make`.
      - name: go test -tags=chromedp
        run: go test -tags=chromedp ./...

  test-heavy:
    name: test-heavy
    runs-on: ubuntu-latest
    # `heavy` build tag covers M4 plugins that pull in go-enry's
    # embedded language database and go-git's shallow clone path
    # (languages.recent, languages.indepth). Both are pure Go, so no
    # chromium container is needed; we just want the wall-time cost
    # off the default `test` job. Parallel with `test` + `test-chromedp`.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go test -tags=heavy
        run: go test -tags=heavy ./...

  compliance:
    name: compliance
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: compliance (no unadopted plugin refs, no removed sentinels, org_repo ignored)
        run: go test ./tests/compliance/...

  smoke-macos:
    name: smoke-macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go build
        run: go build ./...
      - name: go test (config subset, run when packages exist)
        run: |
          if [ -d internal/config ]; then
            go test ./internal/config/...
          else
            echo "internal/config not present yet; smoke build only"
          fi
