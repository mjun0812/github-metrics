name: go-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Track the latest stable Go release. Keep in lockstep with the
  # GOLANGCI_LINT_VERSION pin so the lint binary can fully type-check
  # the modules we ship. Pinned to 1.26.4 for the net/textproto
  # (GO-2026-5039) and crypto/x509 (GO-2026-5037) stdlib fixes.
  GO_VERSION: "1.26.4"
  # Built against Go 1.26; matches the runner pin above.
  GOLANGCI_LINT_VERSION: "v2.12.2"

# Job placement: every Linux/x86 job (test / vet / lint / vuln /
# test-race / test-chromedp / test-heavy / compliance) runs on the
# self-hosted ARC runner scale set `home-k3s-runner` (k3s cluster with
# docker-in-docker, so the test-chromedp container job works) to keep
# GitHub-hosted minute usage down. Only smoke-macos stays on a
# GitHub-hosted macos-latest runner (the sole Darwin capacity).
jobs:
  test:
    name: test
    runs-on: home-k3s-runner
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go test
        # tests/visual requires chromium; that is covered by test-chromedp.
        # Exclude it here so the runner does not fail in CI strict mode.
        run: go list ./... | grep -v 'tests/visual' | xargs go test

  vet:
    name: vet
    runs-on: home-k3s-runner
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go vet
        run: go vet ./...

  lint:
    name: lint
    runs-on: home-k3s-runner
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: --timeout=10m

  vuln:
    name: vuln
    runs-on: home-k3s-runner
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: govulncheck
        run: govulncheck ./...

  test-race:
    name: test-race
    runs-on: home-k3s-runner
    # golang:bookworm provides gcc so the race detector (which requires
    # CGO) works. The k3s runner environment has CGO disabled by default.
    container:
      image: golang:1.26.4-bookworm
    env:
      # Propagates -buildvcs=false to every go command in this job,
      # including the go build call inside tests/integration TestMain,
      # which runs as a child process and does not inherit CLI flags.
      GOFLAGS: -buildvcs=false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go test -race
        # tests/visual requires chromium; exclude it here (covered by test-chromedp).
        # xargs -r skips execution if the package list is empty.
        run: go list ./... | grep -v 'tests/visual' | xargs -r go test -race

  test-chromedp:
    name: test-chromedp
    runs-on: home-k3s-runner
    container:
      image: chromedp/headless-shell:latest
    env:
      METRICS_CHROME_PATH: /headless-shell/headless-shell
    steps:
      # The chromedp/headless-shell image is minimal and ships
      # without `make` or `ca-certificates`. apt-get is available
      # because the base is debian-slim; install the cert bundle so
      # `go mod download` can verify the GoSumDB / proxy TLS chain.
      - name: Install CA certificates
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # `-tags=chromedp` is what the Makefile target sets too; the
      # Makefile is unused here because the image lacks `make`.
      - name: go test -tags=chromedp
        run: go test -tags=chromedp ./...

  test-heavy:
    name: test-heavy
    runs-on: home-k3s-runner
    # `heavy` build tag covers M4 plugins that pull in go-enry's
    # embedded language database and go-git's shallow clone path
    # (languages.recent, languages.indepth). Both are pure Go, so no
    # chromium container is needed; we just want the wall-time cost
    # off the default `test` job. Parallel with `test` + `test-chromedp`.
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go test -tags=heavy
        # tests/visual requires chromium; exclude it here (covered by test-chromedp).
        run: go list -tags=heavy ./... | grep -v 'tests/visual' | xargs go test -tags=heavy

  compliance:
    name: compliance
    runs-on: home-k3s-runner
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: compliance (no unadopted plugin refs, no removed sentinels, org_repo ignored)
        run: go test ./tests/compliance/...

  smoke-macos:
    name: smoke-macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go build
        run: go build ./...
      - name: go test (config subset, run when packages exist)
        run: |
          if [ -d internal/config ]; then
            go test ./internal/config/...
          else
            echo "internal/config not present yet; smoke build only"
          fi
