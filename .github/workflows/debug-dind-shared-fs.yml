name: debug-dind-shared-fs

# One-off probe to map which host-side paths on the ARC k3s runner are
# actually visible to the DinD sidecar's docker daemon via `docker run -v`,
# AND to check inter-step file visibility within the runner container
# (the second case is what actually broke regen-doc-samples.yml — the
# render step wrote files that the very next upload-artifact step could
# not see).
#
# How to read the output:
#   READ_OK    → -v mount path is shared with dind; file visible inside container
#   READ_EMPTY → mount point exists but file disappeared (consistency loss)
#   READ_MISS  → mount point empty (likely runner-only path, dind-side bind silent-fail)
#   WRITE_FAIL → permission / FS issue on runner itself
#
# Run via Actions UI ▸ "debug-dind-shared-fs" ▸ Run workflow.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    name: probe shared FS
    runs-on: home-k3s-runner
    steps:
      # ---------------------------------------------------------------
      # SECTION A — Runner env + mount summary
      # ---------------------------------------------------------------
      - name: A. Runner env + mount summary
        run: |
          set -u
          echo "===== Runner env ====="
          echo "RUNNER_TEMP        = ${RUNNER_TEMP:-<unset>}"
          echo "RUNNER_TOOL_CACHE  = ${RUNNER_TOOL_CACHE:-<unset>}"
          echo "RUNNER_WORKSPACE   = ${RUNNER_WORKSPACE:-<unset>}"
          echo "GITHUB_WORKSPACE   = ${GITHUB_WORKSPACE:-<unset>}"
          echo
          echo "===== Filesystem mounts (interesting) ====="
          mount | grep -E '_work|__w|/tmp|emptyDir|tmpfs|overlay' || echo "(no matching mounts)"
          echo
          echo "===== Existence ====="
          for d in /home/runner /home/runner/_work /__w /tmp; do
            if [ -d "$d" ]; then
              echo "EXIST  $d  ($(stat -c '%a %U:%G' "$d" 2>/dev/null || echo '?'))"
            else
              echo "MISS   $d"
            fi
          done

      # ---------------------------------------------------------------
      # SECTION B — Inter-step file visibility (runner-only)
      # The render step's bug: writes a file then the next step's
      # action cannot see it. Reproduce in two steps.
      # ---------------------------------------------------------------
      - name: B1. Write file in step
        run: |
          set -u
          probe_dir="$GITHUB_WORKSPACE/.interstep-probe"
          mkdir -p "$probe_dir"
          for i in 1 2 3; do
            echo "marker-$i from B1 at $(date -u +%H:%M:%S)" > "$probe_dir/marker-$i.txt"
          done
          echo "Wrote to $probe_dir:"
          ls -la "$probe_dir"
          echo "wc -c of marker-1.txt: $(wc -c < "$probe_dir/marker-1.txt")"

      - name: B2. Read file in NEXT step (runner-side shell)
        run: |
          set -u
          probe_dir="$GITHUB_WORKSPACE/.interstep-probe"
          echo "Looking at $probe_dir from the next step:"
          if [ -d "$probe_dir" ]; then
            ls -la "$probe_dir" || true
            for i in 1 2 3; do
              if [ -f "$probe_dir/marker-$i.txt" ]; then
                echo "READ_OK  marker-$i.txt: $(cat "$probe_dir/marker-$i.txt")"
              else
                echo "READ_MISS marker-$i.txt"
              fi
            done
          else
            echo "INTERSTEP_MISS: directory $probe_dir is GONE between steps"
          fi

      - name: B3. Read same dir via upload-artifact (the regen failure mode)
        uses: actions/upload-artifact@v4
        with:
          name: debug-interstep-probe
          path: ${{ github.workspace }}/.interstep-probe/
          if-no-files-found: warn
          retention-days: 1

      # ---------------------------------------------------------------
      # SECTION C — Runner ↔ DinD sharing via docker run -v
      # ---------------------------------------------------------------
      - name: C1. Write probe files on runner side
        run: |
          set -u
          for p in \
            "$RUNNER_TEMP/dindprobe" \
            "$GITHUB_WORKSPACE/.dindprobe" \
            "$RUNNER_TOOL_CACHE/.dindprobe" \
            "/home/runner/_work/_dindprobe" \
            "/tmp/_dindprobe" ; do
            mkdir -p "$p" 2>/dev/null && echo "from-runner" > "$p/m.txt" 2>/dev/null \
              && echo "RUNNER_WRITE_OK   $p" \
              || echo "RUNNER_WRITE_FAIL $p"
          done

      - name: C2. Read each probe from DinD (one docker run per path)
        run: |
          set -u
          probe_one() {
            local label="$1"; local host="$2"
            if [ ! -d "$host" ]; then
              echo "SKIP             $label (host dir $host missing)"
              return
            fi
            local out
            out=$(docker run --rm -v "$host:/probe" alpine sh -c 'cat /probe/m.txt 2>/dev/null || echo "(no file)"')
            printf "%-18s host=%-50s dind-content=%q\n" "$label" "$host" "$out"
          }

          probe_one "runner_temp"        "$RUNNER_TEMP/dindprobe"
          probe_one "github_workspace"   "$GITHUB_WORKSPACE/.dindprobe"
          probe_one "runner_tool_cache"  "$RUNNER_TOOL_CACHE/.dindprobe"
          probe_one "home_runner_work"   "/home/runner/_work/_dindprobe"
          probe_one "tmp"                "/tmp/_dindprobe"

      - name: C3. Reverse: write inside DinD, read on runner side
        run: |
          set -u
          host_dir="$GITHUB_WORKSPACE/.dindprobe-reverse"
          mkdir -p "$host_dir"
          docker run --rm -v "$host_dir:/out" alpine sh -c 'echo "from-dind" > /out/m.txt'
          echo "After docker run, runner side ls:"
          ls -la "$host_dir" 2>&1
          if [ -f "$host_dir/m.txt" ]; then
            echo "RUNNER_READS_DIND_WRITE OK: $(cat "$host_dir/m.txt")"
          else
            echo "RUNNER_READS_DIND_WRITE MISS (file written by dind invisible to runner)"
          fi

      - name: D. Cleanup
        if: always()
        run: |
          set -u
          rm -rf "$GITHUB_WORKSPACE/.interstep-probe" \
                 "$GITHUB_WORKSPACE/.dindprobe" \
                 "$GITHUB_WORKSPACE/.dindprobe-reverse" \
                 "${RUNNER_TEMP:-/tmp}/dindprobe" \
                 "${RUNNER_TOOL_CACHE:-/tmp}/.dindprobe" \
                 "/home/runner/_work/_dindprobe" \
                 "/tmp/_dindprobe" 2>/dev/null || true
          echo "cleanup done"
