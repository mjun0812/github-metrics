name: debug-dind-shared-fs

# One-off probe to map which host-side paths on the ARC k3s runner are
# actually visible to the DinD sidecar's docker daemon via `docker run -v`.
#
# Background: regen-doc-samples.yml had to switch from `-v RUNNER_TEMP:/out`
# to `--filename -` (commit 822f3f7) because the mount silently failed.
# This workflow figures out exactly which paths are inside the shared
# emptyDir (containerMode.type: dind only shares /home/runner/_work) so
# the workflow can be safely reverted to `-v`-based file output.
#
# How to read the output:
#   - "runner-side write OK" + "dind-side read OK"      → path is shared, -v works
#   - "runner-side write OK" + "dind-side read EMPTY"   → path is runner-only, -v fails silently
#   - "runner-side write FAIL"                          → permission / FS issue on runner itself
#
# Run via Actions UI ▸ "debug-dind-shared-fs" ▸ Run workflow.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    name: probe shared FS
    runs-on: home-k3s-runner
    steps:
      - name: 1. Runner env + mount summary
        run: |
          set -u
          echo "=========================================="
          echo "RUNNER container env (paths workflows use)"
          echo "=========================================="
          echo "RUNNER_TEMP        = ${RUNNER_TEMP:-<unset>}"
          echo "RUNNER_TOOL_CACHE  = ${RUNNER_TOOL_CACHE:-<unset>}"
          echo "RUNNER_WORKSPACE   = ${RUNNER_WORKSPACE:-<unset>}"
          echo "GITHUB_WORKSPACE   = ${GITHUB_WORKSPACE:-<unset>}"
          echo "HOME               = ${HOME:-<unset>}"
          echo "PWD                = $(pwd)"
          echo
          echo "=========================================="
          echo "Runner-side filesystem mounts (_work / __w / tmp)"
          echo "=========================================="
          mount | grep -E '_work|__w|/tmp|emptyDir|tmpfs' || echo "(no matching mounts)"
          echo
          echo "=========================================="
          echo "Top-level dirs that might be shared"
          echo "=========================================="
          for d in /home/runner /home/runner/_work /__w /runner /tmp; do
            if [ -d "$d" ]; then
              echo "EXIST: $d  ($(stat -c '%a %U:%G' "$d" 2>/dev/null || echo '?'))"
            else
              echo "MISS : $d"
            fi
          done

      - name: 2. Write probe markers on runner side
        id: probe
        run: |
          set -u
          # Candidate paths to test for runner <-> dind sharing.
          # Layout: <label>|<host_path_on_runner>|<container_mount_in_dind>
          cat > /tmp/probe-list.txt <<'EOF'
          runner_temp|${RUNNER_TEMP}/probe|/p-runner-temp
          github_workspace|${GITHUB_WORKSPACE}/.probe|/p-github-workspace
          runner_tool_cache|${RUNNER_TOOL_CACHE}/.probe|/p-runner-tool-cache
          home_runner_work|/home/runner/_work/_probe|/p-home-runner-work
          slash_underscore_w|/__w/_probe|/p-slash-underscore-w
          tmp|/tmp/_probe|/p-tmp
          EOF

          echo "=========================================="
          echo "Writing markers from RUNNER side"
          echo "=========================================="
          # Re-expand the env-var refs in the table.
          while IFS='|' read -r label raw_host mount; do
            host=$(eval echo "$raw_host")
            printf '%-22s host=%-50s ' "$label" "$host"
            if mkdir -p "$host" 2>/dev/null && echo "from-runner-$(date -u +%H%M%S)" > "$host/marker.txt" 2>/dev/null; then
              echo "WRITE_OK"
            else
              echo "WRITE_FAIL ($(ls -la "$(dirname "$host")" 2>&1 | head -1))"
            fi
          done < /tmp/probe-list.txt

      - name: 3. Try to read markers from DIND side via docker run -v
        run: |
          set -u
          echo "=========================================="
          echo "Reading markers via docker run -v MOUNT"
          echo "=========================================="

          # Build a single docker run with every probe path mounted.
          mounts=()
          checks=""
          while IFS='|' read -r label raw_host mount; do
            host=$(eval echo "$raw_host")
            # Skip mounts whose host path does not exist on runner — DinD
            # would silently create empty dirs for them and obscure the signal.
            if [ -d "$host" ]; then
              mounts+=("-v" "$host:$mount")
              checks="$checks $label|$mount"
            fi
          done < /tmp/probe-list.txt

          echo "Mounts to test:"
          for m in "${mounts[@]}"; do echo "  $m"; done
          echo

          # Run alpine and read each marker. Use sh -c with a long script.
          docker run --rm "${mounts[@]}" alpine sh -c '
            for spec in '"$checks"'; do
              label=${spec%%|*}
              mount=${spec##*|}
              printf "%-22s mount=%-30s " "$label" "$mount"
              if [ -f "$mount/marker.txt" ]; then
                content=$(cat "$mount/marker.txt" 2>/dev/null)
                if [ -n "$content" ]; then
                  echo "READ_OK     content=\"$content\""
                else
                  echo "READ_EMPTY  (file exists but empty)"
                fi
              else
                ls=$(ls -la "$mount" 2>/dev/null | head -3)
                echo "READ_MISS   ls=\"$ls\""
              fi
            done
          '

      - name: 4. Print DIND container env + mounts (for cross-check)
        run: |
          set -u
          echo "=========================================="
          echo "DIND-side mount summary (from inside docker run)"
          echo "=========================================="
          docker run --rm alpine sh -c '
            echo "mount table inside dind container view:"
            mount | head -30
            echo
            echo "Existence of candidate dirs WITHOUT explicit -v:"
            for d in /home/runner /home/runner/_work /__w /runner /tmp /var/run; do
              if [ -d "$d" ]; then echo "EXIST: $d"; else echo "MISS : $d"; fi
            done
          '

      - name: 5. Cleanup probe markers
        if: always()
        run: |
          set -u
          while IFS='|' read -r label raw_host mount; do
            host=$(eval echo "$raw_host")
            rm -rf "$host" 2>/dev/null || true
          done < /tmp/probe-list.txt
          echo "Cleanup done."
