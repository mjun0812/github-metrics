name: Sample (post-release smoke)

# Post-release smoke verification for the published Action at the
# dispatched `release_tag`. Triggered manually by maintainers after
# publishing a release; not on a schedule and not auto-triggered. Runs
# the published Action on both x86 and arm64 hosted runners and asserts
# both jobs complete within 90s.
#
# `uses:` refs cannot be interpolated with `${{ }}` (#662), so the job
# checks out `release_tag` and runs `uses: ./` instead. That tag's
# action.yml is rewritten by the release pipeline to a docker://
# reference pinned to the published GHCR image, so this exercises the
# exact artifact consumers get from `uses: mjun0812/github-metrics@<tag>`.
#
# The two jobs use --dryrun so they do not need write access to anything;
# they just exercise the metrics-action binary inside the published GHCR
# image end-to-end.
#
# Requirements:
#   - A secret named METRICS_TOKEN must be configured on the repo. The
#     token only needs `repo: read` (octocat profile is public so a
#     classic PAT or the workflow's GITHUB_TOKEN can also be used by
#     swapping the `with.token:` line — but METRICS_TOKEN is the
#     project convention per README.md).
#   - The release vX.Y.Z must exist on GHCR and the GitHub Release page.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'The published release tag to smoke-test (e.g. v1.0.0).'
        required: true
        default: 'v1.0.0'

jobs:
  smoke-x86:
    name: x86_64 smoke (home-k3s-runner)
    runs-on: home-k3s-runner
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag }}
      - uses: ./
        with:
          user: octocat
          token: ${{ secrets.METRICS_TOKEN }}
          template: classic
          # `config_output` is the declared action input; the bare
          # `output` key was never defined in action.yml and the runner
          # silently dropped it (surfaced by actionlint once `uses: ./`
          # made the input list checkable).
          config_output: svg
          dryrun: 'yes'

  # smoke-arm is temporarily disabled to conserve GitHub-hosted Actions
  # usage (ubuntu-24.04-arm is a GitHub-hosted runner). Re-enable by
  # uncommenting once the rate-limit pressure subsides.
  #
  # smoke-arm:
  #   name: arm64 smoke (ubuntu-24.04-arm)
  #   runs-on: ubuntu-24.04-arm
  #   timeout-minutes: 5
  #   steps:
  #     - uses: actions/checkout@v5
  #       with:
  #         ref: ${{ inputs.release_tag }}
  #     - uses: ./
  #       with:
  #         user: octocat
  #         token: ${{ secrets.METRICS_TOKEN }}
  #         template: classic
  #         config_output: svg
  #         dryrun: 'yes'
