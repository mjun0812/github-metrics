name: Regen doc samples

# Regenerates docs/examples/ (SVG + PNG) from the current codebase and
# opens a pull request with the diff. Triggered manually by maintainers;
# never runs on push/schedule to avoid unintended API calls or commits.
#
# What it does:
#   1. Builds the production Docker image from deploy/Dockerfile
#      (tagged github-metrics:local — identical to the local workflow).
#   2. Runs scripts/gen-doc-samples.sh to render all 35 logical samples
#      (SVG + PNG) under docs/examples/.
#   3. If any file changed, opens a draft PR on a fresh branch so the
#      maintainer can review the visual diff before merging.
#   4. If nothing changed, the job exits successfully with no PR.
#
# Requirements:
#   - METRICS_TOKEN secret: classic PAT with read:user + repo scopes.
#     (The workflow's GITHUB_TOKEN is used for PR creation / git push;
#     METRICS_TOKEN is passed to the docker run as GITHUB_TOKEN so the
#     binary can call the GitHub API without hitting rate limits.)
#   - The self-hosted runner labelled [self-hosted, Linux, X64] must have
#     Docker and Go available (same runner used by release.yml).

on:
  workflow_dispatch:
    inputs:
      user:
        description: 'GitHub user for sample renders (METRICS_DOC_USER)'
        required: false
        default: 'mjun0812'
      repo:
        description: 'GitHub repo for repository-mode renders (METRICS_DOC_REPO)'
        required: false
        default: 'flash-attention-prebuild-wheels'

permissions:
  contents: write   # git push (branch + commit)
  pull-requests: write  # gh pr create

env:
  GO_VERSION: "1.26.4"

jobs:
  regen:
    name: Regenerate and open PR
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build github-metrics:local
        run: |
          DOCKER_BUILDKIT=0 docker build \
            -f deploy/Dockerfile \
            -t github-metrics:local \
            .

      - name: Generate doc samples
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
          METRICS_DOC_USER: ${{ inputs.user }}
          METRICS_DOC_REPO: ${{ inputs.repo }}
          METRICS_DOC_IMAGE: github-metrics:local
        run: bash scripts/gen-doc-samples.sh

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet HEAD -- docs/examples/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            changed=$(git diff --name-only HEAD -- docs/examples/ | wc -l | tr -d ' ')
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "count=${changed}" >> "$GITHUB_OUTPUT"
          fi

      - name: No changes — skip PR
        if: steps.diff.outputs.changed == 'false'
        run: echo "docs/examples/ is already up to date. No PR needed."

      - name: Commit and push branch
        if: steps.diff.outputs.changed == 'true'
        run: |
          short_sha="${GITHUB_SHA::7}"
          branch="chore/regen-doc-samples-${short_sha}"
          echo "branch=${branch}" >> "$GITHUB_ENV"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${branch}"
          git add docs/examples/
          git commit -m "chore(docs): regenerate doc samples

Triggered by workflow_dispatch on ${GITHUB_SHA::7}.
User: ${{ inputs.user }} / Repo: ${{ inputs.repo }}
Changed files: ${{ steps.diff.outputs.count }}"
          git push origin "${branch}"

      - name: Create pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head "${branch}" \
            --draft \
            --title "chore(docs): regenerate doc samples" \
            --body "$(cat <<'EOF'
## Summary

Automated regeneration of \`docs/examples/\` triggered via **Regen doc samples** workflow.

- Triggered on: \`${{ github.sha }}\`
- User: \`${{ inputs.user }}\`
- Repo: \`${{ inputs.repo }}\`
- Changed files: ${{ steps.diff.outputs.count }}

## Review checklist

- [ ] SVG/PNG diffs look correct (no rendering regressions)
- [ ] No unexpected files added or removed
- [ ] CI passes on this branch

🤖 Generated by the `regen-doc-samples` workflow
EOF
)"
