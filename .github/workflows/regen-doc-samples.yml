name: Regen doc samples

# Regenerates docs/examples/ (SVG + PNG) in parallel and opens a draft
# PR with the diff. Triggered manually by maintainers only.
#
# Pipeline:
#   setup   — reads scripts/samples.json and emits the render matrix
#   render  — 35 parallel jobs, each running INSIDE the published
#             ghcr.io/mjun0812/github-metrics image as a job-level
#             container; artifacts uploaded
#   open-pr — collects all artifacts, normalizes the SVGs, commits to
#             a branch, opens a draft PR via the REST API
#
# Why job-level containers instead of `docker run` (#523): chromedp /
# chromium does not work when the image is launched through the ARC
# runner's DinD sidecar — every SVG shipped untrimmed (the height
# stayed at the 99999 placeholder) and no PNG could be produced at
# all. go-ci's test-chromedp job proves chromedp works fine inside a
# job-level container on the same `home-k3s-runner` scale set, so the
# render jobs now run the same way.
#
# Requirements:
#   - METRICS_TOKEN secret: classic PAT with read:user + repo scopes.
#     Passed to the render step as METRICS_TOKEN so the binary can
#     call the GitHub API. The workflow's built-in GITHUB_TOKEN is used only
#     for GHCR pull, git push, and the PR-creation API call.
#   - GHCR image ghcr.io/mjun0812/github-metrics:<tag> must exist.
#     The image is published by release.yml on every semver tag push.

on:
  workflow_dispatch:
    inputs:
      user:
        description: 'GitHub user for renders (METRICS_DOC_USER)'
        required: false
        default: 'mjun0812'
      repo:
        description: 'GitHub repo for repository-mode renders (METRICS_DOC_REPO)'
        required: false
        default: 'flash-attention-prebuild-wheels'
      tag:
        description: 'GHCR image tag (e.g. latest, v1.0.0)'
        required: false
        default: 'latest'

permissions:
  contents: write       # git push (new branch + commit)
  pull-requests: write  # PR creation via the REST API
  packages: read        # GHCR pull

env:
  GO_VERSION: "1.26.4"

jobs:
  # ------------------------------------------------------------------ #
  # 1. Build the render matrix from scripts/samples.json               #
  # ------------------------------------------------------------------ #
  setup:
    name: Build render matrix
    runs-on: home-k3s-runner
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5

      - name: Emit matrix JSON
        id: gen
        run: |
          matrix=$(jq -c '.' scripts/samples.json)
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------ #
  # 2. Render one sample per job (parallel)                            #
  # ------------------------------------------------------------------ #
  render:
    name: Render ${{ matrix.name }}
    needs: setup
    runs-on: home-k3s-runner
    container:
      image: ghcr.io/mjun0812/github-metrics:${{ inputs.tag }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # The image ships `USER metrics`, but the runner mounts the job
      # workspace with its own uid — run as root so the step can write
      # $GITHUB_WORKSPACE. chromium is fine with root because chromedp
      # launches it with --no-sandbox.
      options: --user root
    strategy:
      # Cap concurrency so 35 GraphQL-heavy renders don't trip the
      # GitHub secondary rate limit (anti-abuse). 8 still saw ~40% of
      # jobs fail with HTTP 403 because every render runs the same
      # user("mjun0812") query simultaneously; dropping to 4 keeps the
      # burst rate well under the anti-abuse threshold.
      max-parallel: 4
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    steps:
      - name: Render SVG + PNG
        # Inside a job container the default step shell is `sh`, not
        # bash — the array/pipefail syntax below needs the bash that
        # the image ships.
        shell: bash
        env:
          # Passed under a non-reserved name: inside a job container
          # the runner controls the GITHUB_* env namespace and a
          # step-level GITHUB_TOKEN did not survive to the process
          # (the binary saw an invalid value).
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          SAMPLE_NAME: ${{ matrix.name }}
          SAMPLE_MODE: ${{ matrix.mode }}
          SAMPLE_EXTRA: ${{ matrix.extra }}
          INPUT_USER: ${{ inputs.user }}
          INPUT_REPO: ${{ inputs.repo }}
        run: |
          set -euo pipefail
          # The runner exports GITHUB_ACTIONS=true inside job
          # containers, which flips the binary into Action mode
          # (cmd/metrics-cli/main.go): CLI flags are ignored and the
          # token is read from INPUT_TOKEN instead of --token-env.
          # Unset it so the render keeps using the CLI path, exactly
          # like the previous `docker run` (which passed no GITHUB_*
          # env) did.
          unset GITHUB_ACTIONS
          # The ARC runner environment may inject proxy settings that
          # break the container's egress; clear both cases explicitly
          # like the previous `docker run -e` invocation did (the
          # workflow `env:` map is case-insensitive, so this has to
          # happen in the shell).
          export HTTP_PROXY="" HTTPS_PROXY="" http_proxy="" https_proxy=""
          export NO_PROXY="*" no_proxy="*"
          # Non-hidden directory name so actions/upload-artifact@v4
          # picks it up: v4's default include-hidden-files: false
          # silently excludes any path containing a dot-prefixed
          # component (GHSA-mq8m-8jpp-vmrh mitigation), which had been
          # dropping every regenerated sample at upload time.
          outdir="$GITHUB_WORKSPACE/sample-out"
          mkdir -p "$outdir"

          if [[ "$SAMPLE_MODE" == "user" ]]; then
            BASE_ARGS=(--user "$INPUT_USER")
          else
            BASE_ARGS=(--user "$INPUT_USER" --repo "$INPUT_REPO" --template repository)
          fi

          read -ra extra_arr <<< "$SAMPLE_EXTRA"

          for fmt in svg png; do
            out="${outdir}/${SAMPLE_NAME}.${fmt}"
            ok=0
            for attempt in 1 2 3; do
              rm -f "$out"
              RUN_ARGS=(
                "${BASE_ARGS[@]}"
                --token-env METRICS_TOKEN
                --output "$fmt"
                --filename -
                --dryrun
              )
              if [[ "${#extra_arr[@]}" -gt 0 ]]; then
                RUN_ARGS+=("${extra_arr[@]}")
              fi
              tmplog=$(mktemp)
              if /usr/local/bin/metrics-cli "${RUN_ARGS[@]}" > "$out" 2>"$tmplog" \
                  && [[ -s "$out" ]]; then
                ok=1; rm -f "$tmplog"; break
              fi
              cat "$tmplog" >&2; rm -f "$tmplog"
              if [[ "$attempt" -lt 3 ]]; then
                backoff=$(( attempt * 20 ))
                echo "retry ${attempt}/3 ${fmt} in ${backoff}s (let secondary rate limit settle)"
                sleep "$backoff"
              fi
            done
            # Both formats are fatal now. PNG used to be downgraded to
            # a warning while chromedp was broken under DinD (#501);
            # with the job-level container chromedp is expected to
            # work, and a silent PNG gap should fail loudly instead of
            # shipping a half-regenerated sample set (#523).
            if [[ "$ok" -eq 0 ]]; then
              echo "FAIL: ${SAMPLE_NAME}.${fmt} after 3 attempts" >&2
              exit 1
            fi
            # Postcondition (#523): an untrimmed SVG means the
            # chromedp resize step silently failed — exactly the
            # breakage this workflow shipped once. Refuse to upload it.
            if [[ "$fmt" == "svg" ]] && grep -q 'height="99999"' "$out"; then
              echo "FAIL: ${SAMPLE_NAME}.svg still carries the height=99999 placeholder (chromedp trim did not run)" >&2
              exit 1
            fi
            echo "OK: ${SAMPLE_NAME}.${fmt} ($(wc -c < "$out" | tr -d ' ') bytes)"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sample-${{ matrix.name }}
          path: ${{ github.workspace }}/sample-out/
          retention-days: 3

  # ------------------------------------------------------------------ #
  # 3. Collect artifacts, normalize, and open a draft PR               #
  # ------------------------------------------------------------------ #
  open-pr:
    name: Open draft PR
    needs: render
    runs-on: home-k3s-runner
    # Run even when some render matrix entries failed so that the
    # successful artifacts still land in a draft PR. download-artifact
    # silently skips missing names, and the diff check produces a PR
    # only if at least one new artifact actually differs from HEAD.
    if: ${{ !cancelled() }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download all sample artifacts
        uses: actions/download-artifact@v4
        with:
          path: docs/examples/
          pattern: sample-*
          merge-multiple: true

      # Normalization moved here from the render jobs (#523): the
      # render jobs now run inside the production image, which carries
      # no Go toolchain or repo checkout. normalize-svg-stream is
      # idempotent, so re-running it over already-normalized committed
      # files produces no diff.
      - name: Normalize SVGs
        run: |
          set -euo pipefail
          for f in docs/examples/*.svg; do
            go run ./internal/tools/normalize-svg-stream < "$f" > "${f}.norm"
            mv "${f}.norm" "$f"
          done

      - name: Note failed renders (if any)
        id: failed
        env:
          RENDER_RESULT: ${{ needs.render.result }}
        run: |
          if [[ "$RENDER_RESULT" == "success" ]]; then
            echo "any_failed=false" >> "$GITHUB_OUTPUT"
            echo "note=" >> "$GITHUB_OUTPUT"
          else
            echo "any_failed=true"  >> "$GITHUB_OUTPUT"
            echo "note=Some render matrix entries failed (needs.render.result=${RENDER_RESULT}); the PR only contains the artifacts that uploaded successfully. Check the workflow run for the failed jobs." >> "$GITHUB_OUTPUT"
          fi

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet HEAD -- docs/examples/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            count=$(git diff --name-only HEAD -- docs/examples/ | wc -l | tr -d ' ')
            echo "changed=true"  >> "$GITHUB_OUTPUT"
            echo "count=${count}" >> "$GITHUB_OUTPUT"
          fi

      - name: No changes — skip PR
        if: steps.diff.outputs.changed == 'false'
        run: echo "docs/examples/ is already up to date. No PR needed."

      - name: Commit and push branch
        if: steps.diff.outputs.changed == 'true'
        env:
          COMMIT_USER: ${{ inputs.user }}
          COMMIT_REPO: ${{ inputs.repo }}
          COMMIT_TAG: ${{ inputs.tag }}
          COMMIT_COUNT: ${{ steps.diff.outputs.count }}
        run: |
          short_sha="${GITHUB_SHA:0:7}"
          branch="chore/regen-doc-samples-${short_sha}"
          echo "branch=${branch}" >> "$GITHUB_ENV"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${branch}"
          git add docs/examples/
          commit_msg=$(printf 'chore(docs): regenerate doc samples\n\nTriggered by workflow_dispatch on %s.\nUser: %s / Repo: %s / Tag: %s\nChanged files: %s' \
            "${short_sha}" "${COMMIT_USER}" "${COMMIT_REPO}" "${COMMIT_TAG}" "${COMMIT_COUNT}")
          git commit -m "${commit_msg}"
          git push origin "${branch}"

      # The PR is created through the REST API via actions/github-script
      # because the self-hosted runner image does not ship the gh CLI
      # (#523 — the previous `gh pr create` step failed with
      # `gh: command not found`).
      - name: Create pull request
        if: steps.diff.outputs.changed == 'true'
        uses: actions/github-script@v8
        env:
          PR_TAG: ${{ inputs.tag }}
          PR_USER: ${{ inputs.user }}
          PR_REPO: ${{ inputs.repo }}
          PR_COUNT: ${{ steps.diff.outputs.count }}
          PR_FAILED_NOTE: ${{ steps.failed.outputs.note }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { PR_TAG, PR_USER, PR_REPO, PR_COUNT, PR_FAILED_NOTE, branch } = process.env;
            const partial = PR_FAILED_NOTE
              ? `## Partial run\n\n> ${PR_FAILED_NOTE}\n\n`
              : '';
            const body = [
              '## Summary',
              '',
              'Automated regeneration of `docs/examples/` triggered via **Regen doc samples** workflow.',
              '',
              `- Triggered on: \`${context.sha}\``,
              `- Image tag: \`${PR_TAG}\``,
              `- User: \`${PR_USER}\``,
              `- Repo: \`${PR_REPO}\``,
              `- Changed files: ${PR_COUNT}`,
              '',
              `${partial}## Review checklist`,
              '',
              '- [ ] SVG/PNG diffs look correct (no rendering regressions)',
              '- [ ] No unexpected files added or removed',
              '',
              '🤖 Generated by the `regen-doc-samples` workflow',
            ].join('\n');
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: 'main',
              head: branch,
              draft: true,
              title: 'chore(docs): regenerate doc samples',
              body,
            });
            core.info(`Created draft PR: ${pr.html_url}`);
