name: Regen doc samples

# Regenerates docs/examples/ (SVG + PNG) in parallel and opens a draft
# PR with the diff. Triggered manually by maintainers only.
#
# Two modes (controlled by workflow_dispatch inputs):
#
#   1. `tag` (default `latest`): pulls a PUBLISHED image from GHCR
#      (built by release.yml on every semver tag push). Use this for
#      regen against a stable release.
#
#   2. `branch` (overrides `tag` when set): self-builds a single-arch
#      linux/amd64 image from the branch's HEAD, pushes it as a
#      `preview-<sha7>` tag to GHCR, and uses it for the render matrix.
#      A cleanup job deletes the preview tag at the end of the run.
#      Use this to validate a refactor PR's render changes WITHOUT
#      having to cut a release tag first (#642).
#
# Pipeline:
#   build-preview  — (branch mode only) build + push preview-<sha7> image
#   setup          — reads scripts/samples.json and emits the render matrix
#   render         — N parallel jobs, each running INSIDE the resolved
#                    image as a job-level container; artifacts uploaded
#   open-pr        — collects all artifacts, normalizes the SVGs, commits to
#                    a branch, opens a draft PR via the REST API
#   cleanup-preview — (branch mode only) deletes the preview-<sha7> tag
#                    from GHCR (success or failure)
#
# Why job-level containers instead of `docker run` (#523): the render
# jobs run the production image (which now rasterizes via the resvg
# binary, #409 Phase D) as a job-level container on the
# `ubuntu-latest` GitHub-hosted runners. This historically also sidestepped the
# chromium-in-DinD breakage that predated the resvg switch; resvg is a
# self-contained subprocess with none of those constraints.
#
# Requirements:
#   - METRICS_TOKEN secret: classic PAT with read:user + repo scopes.
#     Exposed to the render step as the GITHUB_TOKEN env var so the
#     metrics-cli binary (CLI mode) picks it up via its canonical
#     GITHUB_TOKEN fallback (#647). The workflow's built-in
#     GITHUB_TOKEN is used only for GHCR pull / push / delete, git
#     push, and the PR-creation API call.
#   - For `tag` mode: GHCR image ghcr.io/mjun0812/github-metrics:<tag> must
#     exist. The image is published by release.yml on every semver tag push.
#   - For `branch` mode: GITHUB_TOKEN with `packages: write` permission
#     (already granted below).

on:
  workflow_dispatch:
    inputs:
      user:
        description: 'GitHub user for renders (METRICS_DOC_USER)'
        required: false
        default: 'mjun0812'
      repo:
        description: 'GitHub repo for repository-mode renders (METRICS_DOC_REPO)'
        required: false
        default: 'flash-attention-prebuild-wheels'
      tag:
        description: 'GHCR image tag (e.g. latest, v1.0.0); ignored when `branch` is set'
        required: false
        default: 'latest'
      branch:
        description: 'Branch to build a preview image from (overrides `tag`; pushes preview-<sha7> to GHCR, auto-deleted after run)'
        required: false
        default: ''

permissions:
  contents: write       # git push (new branch + commit)
  pull-requests: write  # PR creation via the REST API
  packages: write       # GHCR pull AND push+delete (for `branch` preview build)

env:
  GO_VERSION: "1.26.5"
  REGISTRY_IMAGE: ghcr.io/mjun0812/github-metrics

jobs:
  # ------------------------------------------------------------------ #
  # 0. (branch mode only) Build + push the preview image               #
  # ------------------------------------------------------------------ #
  build-preview:
    name: Build preview image (branch mode)
    if: inputs.branch != ''
    runs-on: ubuntu-latest
    outputs:
      # `forward` / `tagname` are the steps that actually emit these
      # values. The docker/build-push-action step (`publish`) exposes
      # only imageid/digest/metadata — referencing it here left both
      # outputs empty, so branch mode silently rendered with :latest
      # and cleanup-preview never matched a tag to delete.
      image_ref: ${{ steps.forward.outputs.image_ref }}
      preview_tag: ${{ steps.tagname.outputs.preview_tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}

      - name: Resolve preview tag from branch HEAD
        id: tagname
        run: |
          short_sha="${GITHUB_SHA:0:7}"
          # Append a numeric run suffix so a re-run on the same sha
          # gets a fresh tag (the previous run's cleanup may have just
          # deleted preview-<sha7>; pushing the same tag immediately
          # afterwards races with GHCR's tag GC).
          preview_tag="preview-${short_sha}-${GITHUB_RUN_ATTEMPT}"
          echo "preview_tag=${preview_tag}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.13.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push preview image (linux/amd64 only)
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v5.7.0
        env:
          PREVIEW_TAG: ${{ steps.tagname.outputs.preview_tag }}
        with:
          context: .
          # Single-arch only: the regen render jobs all run on
          # linux/amd64 ubuntu-latest runners, so the multi-arch manifest
          # build that release.yml does (~13min for arm64 + amd64) is
          # wasted cost here.
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY_IMAGE }}:${{ steps.tagname.outputs.preview_tag }}
          # Lean build cache: skip provenance / sbom that release.yml
          # attaches (cosign signing isn't relevant for a transient
          # preview tag that lives ~30 minutes).
          provenance: false
          sbom: false

      - name: Expose resolved image ref
        id: forward
        env:
          PREVIEW_TAG: ${{ steps.tagname.outputs.preview_tag }}
        run: |
          echo "image_ref=${REGISTRY_IMAGE}:${PREVIEW_TAG}" >> "$GITHUB_OUTPUT"

  # ------------------------------------------------------------------ #
  # 1. Build the render matrix from scripts/samples.json               #
  # ------------------------------------------------------------------ #
  setup:
    name: Build render matrix
    runs-on: ubuntu-latest
    # Run even when build-preview was skipped (tag mode). Without the
    # `always() && !failure()` guard, GitHub Actions short-circuits
    # `setup` to "skipped" once any `needs:` entry was skipped — which
    # then cascades to the render matrix.
    needs: [build-preview]
    if: always() && !failure() && !cancelled()
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      image_ref: ${{ steps.image.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch || github.ref }}

      - name: Emit matrix JSON
        id: gen
        run: |
          matrix=$(jq -c '.' scripts/samples.json)
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

      - name: Resolve render image ref
        id: image
        env:
          BUILD_PREVIEW_REF: ${{ needs.build-preview.outputs.image_ref }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          if [[ -n "$BUILD_PREVIEW_REF" ]]; then
            echo "image_ref=${BUILD_PREVIEW_REF}" >> "$GITHUB_OUTPUT"
            echo "Using preview image: ${BUILD_PREVIEW_REF}"
          else
            ref="${REGISTRY_IMAGE}:${TAG_INPUT}"
            echo "image_ref=${ref}" >> "$GITHUB_OUTPUT"
            echo "Using published image: ${ref}"
          fi

  # ------------------------------------------------------------------ #
  # 2. Render one sample per job (parallel)                            #
  # ------------------------------------------------------------------ #
  render:
    name: Render ${{ matrix.name }}
    needs: setup
    # Same skip-cascade guard as `setup` (#658): in tag mode
    # `build-preview` is skipped, and GitHub Actions' default success()
    # condition evaluates false when any *transitive* dependency was
    # skipped — without this guard every render job silently skips and
    # the run still ends green.
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.setup.outputs.image_ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      # The image ships `USER metrics`, but the runner mounts the job
      # workspace with its own uid — run as root so the step can write
      # $GITHUB_WORKSPACE. resvg runs fine as root (no sandbox).
      options: --user root
    strategy:
      # Cap concurrency so 35 GraphQL-heavy renders don't trip the
      # GitHub secondary rate limit (anti-abuse). 8 still saw ~40% of
      # jobs fail with HTTP 403 because every render runs the same
      # user("mjun0812") query simultaneously; dropping to 4 keeps the
      # burst rate well under the anti-abuse threshold.
      max-parallel: 4
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}

    steps:
      - name: Render SVG (fetch once) + derive PNG
        # Inside a job container the default step shell is `sh`, not
        # bash — the array/pipefail syntax below needs the bash that
        # the image ships.
        shell: bash
        env:
          # The `metrics-cli` binary reads its GitHub PAT from GITHUB_TOKEN
          # (CLI mode) since v3.0 (#647). The job container exports the
          # runner's automatic GITHUB_TOKEN by default — we override it
          # here with the METRICS_TOKEN secret because the runner token
          # lacks the scopes the renders need (read:user, repo, etc).
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
          SAMPLE_NAME: ${{ matrix.name }}
          SAMPLE_MODE: ${{ matrix.mode }}
          SAMPLE_EXTRA: ${{ matrix.extra }}
          INPUT_USER: ${{ inputs.user }}
          INPUT_REPO: ${{ inputs.repo }}
          RESOLVED_IMAGE_REF: ${{ needs.setup.outputs.image_ref }}
        run: |
          set -euo pipefail
          # The runner exports GITHUB_ACTIONS=true inside job
          # containers, which flips the binary into Action mode
          # (cmd/metrics-cli/main.go): CLI flags are ignored and the
          # token is read from INPUT_TOKEN.
          # Unset it so the render keeps using the CLI path, exactly
          # like the previous `docker run` (which passed no GITHUB_*
          # env) did. The CLI path reads GITHUB_TOKEN from this step's
          # env: map above (the binary has no --token / --token-env
          # flag as of v3.0, #647).
          unset GITHUB_ACTIONS
          # The ARC runner environment may inject proxy settings that
          # break the container's egress; clear both cases explicitly
          # like the previous `docker run -e` invocation did (the
          # workflow `env:` map is case-insensitive, so this has to
          # happen in the shell).
          export HTTP_PROXY="" HTTPS_PROXY="" http_proxy="" https_proxy=""
          export NO_PROXY="*" no_proxy="*"
          # Non-hidden directory name so actions/upload-artifact@v4
          # picks it up: v4's default include-hidden-files: false
          # silently excludes any path containing a dot-prefixed
          # component (GHSA-mq8m-8jpp-vmrh mitigation), which had been
          # dropping every regenerated sample at upload time.
          outdir="$GITHUB_WORKSPACE/sample-out"
          mkdir -p "$outdir"

          if [[ "$SAMPLE_MODE" == "user" ]]; then
            BASE_ARGS=(--user "$INPUT_USER")
          else
            BASE_ARGS=(--user "$INPUT_USER" --repo "$INPUT_REPO" --template repository)
          fi

          read -ra extra_arr <<< "$SAMPLE_EXTRA"

          # --- 1. Fetch the SVG once (the only API-touching step) ------
          # Previously this loop also ran a second `--output png`
          # invocation, which re-ran the entire engine pipeline (base +
          # plugin queries + REST calls) and doubled the per-sample
          # rate-limit cost — the single largest multiplier in sample
          # generation (#527). With 3 retries the worst case was 6 full
          # fetches. We now fetch the SVG once and derive the PNG from it
          # locally (step 2), halving the API cost and guaranteeing the
          # SVG and PNG share one data snapshot.
          svg_out="${outdir}/${SAMPLE_NAME}.svg"
          ok=0
          for attempt in 1 2 3; do
            rm -f "$svg_out"
            RUN_ARGS=(
              "${BASE_ARGS[@]}"
              --output svg
              --filename -
              --dryrun
              # Strict rate-limit gate (#529): a batch regen must abort
              # loudly when a pool is exhausted rather than ship a sample
              # that silently lost rows mid-run (#522).
              --plugin config_rate_limit_guard=fail
            )
            if [[ "${#extra_arr[@]}" -gt 0 ]]; then
              RUN_ARGS+=("${extra_arr[@]}")
            fi
            tmplog=$(mktemp)
            if /usr/local/bin/metrics-cli "${RUN_ARGS[@]}" > "$svg_out" 2>"$tmplog" \
                && [[ -s "$svg_out" ]]; then
              ok=1; rm -f "$tmplog"; break
            fi
            cat "$tmplog" >&2; rm -f "$tmplog"
            if [[ "$attempt" -lt 3 ]]; then
              backoff=$(( attempt * 20 ))
              echo "retry ${attempt}/3 svg in ${backoff}s (let secondary rate limit settle)"
              sleep "$backoff"
            fi
          done
          if [[ "$ok" -eq 0 ]]; then
            echo "FAIL: ${SAMPLE_NAME}.svg after 3 attempts" >&2
            exit 1
          fi
          # Postcondition (#523): an SVG that still carries the 99999
          # placeholder means the template's Go-side height computation
          # (#409 Phase C) silently failed to finalize the root <svg>
          # height. Refuse to upload it. Checked BEFORE conversion so a
          # bad SVG never produces a bad PNG either.
          if grep -q 'height="99999"' "$svg_out"; then
            echo "FAIL: ${SAMPLE_NAME}.svg still carries the height=99999 placeholder (height was not finalized)" >&2
            exit 1
          fi
          # Postcondition: a near-zero root height means every section
          # rendered empty (e.g. a transient empty API response — run
          # 28999435871 shipped a 1457-byte plugin-languages.svg with
          # height 0). The smallest legitimate sample is >40px, so
          # anything under 10px is an empty card that must not replace
          # a good committed sample.
          # (sed, not `grep -o ... | grep -o '[0-9]*$'`: the attribute's
          # closing quote made the tail grep match nothing, so root_h
          # came back empty and the -lt comparison treated it as 0 —
          # which failed every render in run 29001143452.)
          root_h=$(head -c 500 "$svg_out" | sed -n 's/.*<svg[^>]*height="\([0-9]\{1,\}\)".*/\1/p')
          if [[ "${root_h:-0}" -lt 10 ]]; then
            echo "FAIL: ${SAMPLE_NAME}.svg root height ${root_h}px — every section rendered empty (transient API gap?)" >&2
            exit 1
          fi
          echo "OK: ${SAMPLE_NAME}.svg ($(wc -c < "$svg_out" | tr -d ' ') bytes)"

          # --- 2. Derive the PNG from the rendered SVG (no API) --------
          # svg2png ships in the production image next to metrics-cli
          # (see Dockerfile) and rasterizes through the identical
          # internal/render.Resvg path that `--output png` uses, so the
          # PNG is pixel-equivalent. It is API-free and deterministic, so
          # a single attempt is enough; a missing/empty PNG stays fatal
          # (#523) — resvg is expected to work in the job-level container,
          # and a silent PNG gap must fail loudly instead of shipping a
          # half-regenerated sample.
          png_out="${outdir}/${SAMPLE_NAME}.png"
          rm -f "$png_out"
          # Friendly guard: image tags <= v1.2.0 predate the svg2png
          # binary — tell the operator which tag to use instead of a
          # bare "No such file or directory".
          if [[ ! -x /usr/local/bin/svg2png ]]; then
            echo "FAIL: /usr/local/bin/svg2png not found in image '${RESOLVED_IMAGE_REF}' — single-fetch regen needs an image built after #527 (v1.2.1+)" >&2
            exit 1
          fi
          if ! /usr/local/bin/svg2png --out "$outdir" "$svg_out" || [[ ! -s "$png_out" ]]; then
            echo "FAIL: ${SAMPLE_NAME}.png conversion from SVG failed" >&2
            exit 1
          fi
          echo "OK: ${SAMPLE_NAME}.png ($(wc -c < "$png_out" | tr -d ' ') bytes)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sample-${{ matrix.name }}
          path: ${{ github.workspace }}/sample-out/
          retention-days: 3

  # ------------------------------------------------------------------ #
  # 3. Collect artifacts, normalize, and open a draft PR               #
  # ------------------------------------------------------------------ #
  open-pr:
    name: Open draft PR
    needs: [setup, render]
    runs-on: ubuntu-latest
    # Run even when some render matrix entries failed so that the
    # successful artifacts still land in a draft PR. download-artifact
    # silently skips missing names, and the diff check produces a PR
    # only if at least one new artifact actually differs from HEAD.
    if: ${{ !cancelled() }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # In branch mode we want the PR base to still be `main`, so
          # we deliberately do NOT check out the preview branch here.

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download all sample artifacts
        uses: actions/download-artifact@v4
        with:
          path: docs/examples/
          pattern: sample-*
          merge-multiple: true

      - name: Note failed renders (if any)
        id: failed
        env:
          RENDER_RESULT: ${{ needs.render.result }}
        run: |
          if [[ "$RENDER_RESULT" == "success" ]]; then
            echo "any_failed=false" >> "$GITHUB_OUTPUT"
            echo "note=" >> "$GITHUB_OUTPUT"
          else
            echo "any_failed=true"  >> "$GITHUB_OUTPUT"
            echo "note=Some render matrix entries failed (needs.render.result=${RENDER_RESULT}); the PR only contains the artifacts that uploaded successfully. Check the workflow run for the failed jobs." >> "$GITHUB_OUTPUT"
          fi

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet HEAD -- docs/examples/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            count=$(git diff --name-only HEAD -- docs/examples/ | wc -l | tr -d ' ')
            echo "changed=true"  >> "$GITHUB_OUTPUT"
            echo "count=${count}" >> "$GITHUB_OUTPUT"
          fi

      - name: No changes — skip PR
        if: steps.diff.outputs.changed == 'false'
        run: echo "docs/examples/ is already up to date. No PR needed."

      - name: Commit and push branch
        if: steps.diff.outputs.changed == 'true'
        env:
          COMMIT_USER: ${{ inputs.user }}
          COMMIT_REPO: ${{ inputs.repo }}
          COMMIT_TAG: ${{ inputs.tag }}
          COMMIT_BRANCH: ${{ inputs.branch }}
          COMMIT_IMAGE: ${{ needs.setup.outputs.image_ref }}
          COMMIT_COUNT: ${{ steps.diff.outputs.count }}
        run: |
          short_sha="${GITHUB_SHA:0:7}"
          # Branch suffix differs between tag mode (sha) and branch
          # mode (branch name + sha) so concurrent regen runs do not
          # clobber each other's draft PRs.
          if [[ -n "$COMMIT_BRANCH" ]]; then
            slug="${COMMIT_BRANCH//\//-}"
            branch="chore/regen-doc-samples-${slug}-${short_sha}"
          else
            branch="chore/regen-doc-samples-${short_sha}"
          fi
          echo "branch=${branch}" >> "$GITHUB_ENV"

          # Render-source description for the commit message: which
          # image actually produced the bytes in this PR.
          if [[ -n "$COMMIT_BRANCH" ]]; then
            source_line="Source: branch \`${COMMIT_BRANCH}\` (image ${COMMIT_IMAGE})"
          else
            source_line="Source: tag \`${COMMIT_TAG}\` (image ${COMMIT_IMAGE})"
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${branch}"
          git add docs/examples/
          commit_msg=$(printf 'chore(docs): regenerate doc samples\n\nTriggered by workflow_dispatch on %s.\n%s\nUser: %s / Repo: %s\nChanged files: %s' \
            "${short_sha}" "${source_line}" "${COMMIT_USER}" "${COMMIT_REPO}" "${COMMIT_COUNT}")
          git commit -m "${commit_msg}"
          # Force push: the branch is workflow-owned and keyed to the
          # base sha, and a job rerun rebuilds it from scratch — a
          # plain push would be rejected non-fast-forward by the
          # previous attempt's push.
          git push --force origin "${branch}"

      # The PR is created through the REST API via actions/github-script
      # because the self-hosted runner image does not ship the gh CLI
      # (#523 — the previous `gh pr create` step failed with
      # `gh: command not found`).
      - name: Create pull request
        if: steps.diff.outputs.changed == 'true'
        uses: actions/github-script@v8
        env:
          PR_TAG: ${{ inputs.tag }}
          PR_BRANCH: ${{ inputs.branch }}
          PR_IMAGE: ${{ needs.setup.outputs.image_ref }}
          PR_USER: ${{ inputs.user }}
          PR_REPO: ${{ inputs.repo }}
          PR_COUNT: ${{ steps.diff.outputs.count }}
          PR_FAILED_NOTE: ${{ steps.failed.outputs.note }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { PR_TAG, PR_BRANCH, PR_IMAGE, PR_USER, PR_REPO, PR_COUNT, PR_FAILED_NOTE, branch } = process.env;
            const partial = PR_FAILED_NOTE
              ? `## Partial run\n\n> ${PR_FAILED_NOTE}\n\n`
              : '';
            const sourceLine = PR_BRANCH
              ? `- Source: branch \`${PR_BRANCH}\` (preview image \`${PR_IMAGE}\`)`
              : `- Source: tag \`${PR_TAG}\` (image \`${PR_IMAGE}\`)`;
            const body = [
              '## Summary',
              '',
              'Automated regeneration of `docs/examples/` triggered via **Regen doc samples** workflow.',
              '',
              `- Triggered on: \`${context.sha}\``,
              sourceLine,
              `- User: \`${PR_USER}\``,
              `- Repo: \`${PR_REPO}\``,
              `- Changed files: ${PR_COUNT}`,
              '',
              `${partial}## Review checklist`,
              '',
              '- [ ] SVG/PNG diffs look correct (no rendering regressions)',
              '- [ ] No unexpected files added or removed',
              '',
              '🤖 Generated by the `regen-doc-samples` workflow',
            ].join('\n');
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: 'main',
              head: branch,
              draft: true,
              title: 'chore(docs): regenerate doc samples',
              body,
            });
            core.info(`Created draft PR: ${pr.html_url}`);

  # ------------------------------------------------------------------ #
  # 4. (branch mode only) Delete the preview image from GHCR           #
  # ------------------------------------------------------------------ #
  cleanup-preview:
    name: Cleanup preview image (branch mode)
    needs: [build-preview, open-pr]
    if: always() && inputs.branch != '' && needs.build-preview.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Delete preview tag from GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_TAG: ${{ needs.build-preview.outputs.preview_tag }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE: github-metrics
        run: |
          set -euo pipefail
          # Find the GHCR version-id whose tag list contains
          # PREVIEW_TAG. The user-packages endpoint covers both user
          # and personal-org accounts; falls back to /orgs/ for org
          # accounts where the user endpoint returns 404.
          api_base_user="https://api.github.com/users/${OWNER}/packages/container/${PACKAGE}/versions"
          api_base_org="https://api.github.com/orgs/${OWNER}/packages/container/${PACKAGE}/versions"

          response_user=$(curl -s -o /tmp/versions.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${api_base_user}?per_page=100")
          if [[ "${response_user}" != "200" ]]; then
            echo "User endpoint returned ${response_user}; falling back to org endpoint"
            curl -fsSL -o /tmp/versions.json \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${api_base_org}?per_page=100"
            api_base="${api_base_org}"
          else
            api_base="${api_base_user}"
          fi

          version_id=$(jq -r --arg tag "${PREVIEW_TAG}" \
            '.[] | select(.metadata.container.tags[]? == $tag) | .id' \
            /tmp/versions.json | head -n1)

          if [[ -z "${version_id}" ]]; then
            echo "preview tag ${PREVIEW_TAG} not found on GHCR (already deleted?); nothing to do"
            exit 0
          fi

          echo "Deleting GHCR version ${version_id} (tag ${PREVIEW_TAG})"
          curl -fsSL -X DELETE \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${api_base}/${version_id}"
          echo "Deleted."
