name: Release

# Triggers on semver tags (v1.2.3) pushed to the repository. Builds
# and publishes 3 artifact classes (M10 final shape):
#
#   1. Multi-arch Docker manifest list (linux/amd64 + linux/arm64) on
#      ghcr.io/mjun0812/github-metrics (vX.Y.Z + latest + sha-<short>)
#      — consumed by `uses: mjun0812/github-metrics@<tag>` callers.
#   2. Cross-compiled CLI binaries (linux/darwin × amd64/arm64) as
#      GitHub Releases assets plus a SHA256SUMS file.
#   3. Cosign keyless OIDC signatures for the image manifest and
#      every binary + SHA256SUMS, verifiable against the GitHub
#      Actions OIDC issuer (sigstore Rekor public transparency log).
#
# Pipeline ordering: a `docker-smoke` gate job builds the image
# locally (amd64) and runs `metrics-cli --help` + size-budget
# assertion (FR-006). If it fails, release-docker and release-binary
# do not start — nothing oversized lands on GHCR.
#
# Dry-run: `workflow_dispatch` with `dry_run=true` (default) runs
# the full build chain but skips GHCR push, GitHub Release upload,
# and cosign signing. Artifacts are uploaded as workflow artifacts
# with 7-day retention for manual inspection.
#
# Distribution targets: GHCR (semver tags) and GitHub Releases
# (go install).

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'When true, build artifacts but skip publish steps.'
        required: false
        default: 'true'

permissions:
  contents: write   # GitHub Releases asset upload + floating-tag advance
  packages: write   # GHCR push
  id-token: write   # cosign keyless OIDC (M10)

env:
  REGISTRY_IMAGE: ghcr.io/mjun0812/github-metrics

jobs:
  docker-smoke:
    name: Smoke-test the production Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run M10 docker-smoke (build + --help + ≤900MB assertion)
        # Inlined from the Makefile `docker-smoke` target so the step
        # does not depend on the runner's preinstalled toolchain.
        run: go test -tags=docker_smoke -v ./tests/integration/...

  # Per-arch image build on a NATIVE runner (no QEMU emulation).
  #
  # Replaces the prior single buildx job that built both architectures
  # in one place via QEMU. QEMU arm64 emulation was the dominant ~19m
  # cost of every release; native arm64 runners (ubuntu-24.04-arm, GA
  # since 2025-01) bring that down to ~3-5 min per arch in parallel.
  #
  # Each matrix entry pushes the image **by digest only** (no tag).
  # The merge-manifest job below assembles the per-arch digests into
  # a single multi-arch manifest list and assigns the three release
  # tags (vX.Y.Z + latest + sha-<short>) in one shot.
  #
  # Reference pattern:
  #   https://docs.docker.com/build/ci/github-actions/multi-platform/#distribute-build-across-multiple-runners
  build-image:
    name: Build image (${{ matrix.platform }})
    needs: docker-smoke
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract semver tag (or dry-run placeholder)
        id: tag
        run: |
          short_sha="${GITHUB_SHA::7}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="dryrun-${short_sha}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v3.13.0

      - name: Build and push image by digest (${{ matrix.platform }})
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.7.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ steps.tag.outputs.tag }}
          # push-by-digest=true: push the per-arch image manifest to
          # GHCR but DO NOT create / update any tag. The merge-manifest
          # job below uses these digests to assemble the multi-arch
          # manifest list and attach the three release tags atomically.
          outputs: |
            type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event.inputs.dry_run != 'true' }}
          # GitHub Actions cache, scoped per architecture so amd64 and
          # arm64 don't collide. mode=max keeps every intermediate
          # layer — the `cargo install resvg` build stage and the
          # apt-get install of Noto fonts are the dominant cost
          # (several minutes, especially arm64 via QEMU — worth caching).
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Export digest
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          # Reset before touching the new digest: the build-image job
          # also runs on a self-hosted ARC runner pod whose work tree
          # is preserved across job invocations, so /tmp/digests/ would
          # otherwise carry every prior release's digest file forward.
          # The Upload digest artifact step uploads /tmp/digests/* into
          # a single digests-${arch} artifact, so accumulation here
          # would inflate the artifact and feed every old digest into
          # the merge-manifest job's imagetools create source list.
          # (Companion to the corresponding reset in merge-manifest.)
          rm -rf /tmp/digests
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest artifact
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combine the per-arch digests into a single multi-arch manifest
  # list, tag it, and sign the result with cosign keyless OIDC.
  #
  # Skipped in dry-run mode (build-image's `push=false` produces no
  # digest to merge).
  merge-manifest:
    name: Merge multi-arch manifest + cosign sign
    needs: build-image
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.dry_run != 'true' }}
    steps:
      - name: Extract semver tag
        id: tag
        run: |
          short_sha="${GITHUB_SHA::7}"
          tag="${GITHUB_REF#refs/tags/}"
          # Pre-release tags (vX.Y.Z-<identifier>, SemVer 2.0.0 §9) must
          # not advance the :latest Docker tag — mirrors the FR-004
          # exclusion update-floating-tag applies to the vMAJOR git tag.
          if [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            echo "latest=false" >> "$GITHUB_OUTPUT"
            echo "Pre-release ${tag} — :latest will NOT be tagged or signed"
          else
            echo "latest=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"

      # Wipe any leftover digest files before downloading this run's
      # artifacts. The merge-manifest job runs on a self-hosted ARC
      # runner pod whose work tree is preserved across job invocations,
      # so /tmp/digests/ accumulates per-arch digest files from every
      # prior release. Without this reset, `docker buildx imagetools
      # create ... $(printf '...@sha256:%s ' *)` ships an ever-growing
      # multi-arch manifest containing every previous release's amd64
      # and arm64 entries — v1.1.3 ended up with 4 amd64 + 4 arm64
      # entries, and `docker pull :latest` deterministically resolved
      # to the FIRST amd64 entry (which happened to be the v1.1.0
      # binary), silently pinning every downstream consumer.
      - name: Reset /tmp/digests (avoid cross-release accumulation)
        run: rm -rf /tmp/digests && mkdir -p /tmp/digests

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v3.13.0

      - name: Create manifest list + tag + push
        working-directory: /tmp/digests
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          SHORT_SHA: ${{ steps.tag.outputs.short_sha }}
          LATEST: ${{ steps.tag.outputs.latest }}
        run: |
          set -euo pipefail
          # Each file in /tmp/digests/ is named after a per-arch
          # digest (the sha256:... prefix is stripped by `touch
          # ${digest#sha256:}` in the build-image job).
          tags=(-t "${REGISTRY_IMAGE}:${TAG}" -t "${REGISTRY_IMAGE}:sha-${SHORT_SHA}")
          if [[ "${LATEST}" == "true" ]]; then
            tags+=(-t "${REGISTRY_IMAGE}:latest")
          fi
          docker buildx imagetools create \
            "${tags[@]}" \
            $(printf "${REGISTRY_IMAGE}@sha256:%s " *)

      - name: Inspect multi-arch manifest (informational)
        run: |
          docker buildx imagetools inspect "${REGISTRY_IMAGE}:${{ steps.tag.outputs.tag }}" || true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign multi-arch manifest (cosign keyless OIDC)
        env:
          COSIGN_EXPERIMENTAL: '1'
          LATEST: ${{ steps.tag.outputs.latest }}
        run: |
          cosign sign --yes "${REGISTRY_IMAGE}:${{ steps.tag.outputs.tag }}"
          if [[ "${LATEST}" == "true" ]]; then
            cosign sign --yes "${REGISTRY_IMAGE}:latest"
          fi
          cosign sign --yes "${REGISTRY_IMAGE}:sha-${{ steps.tag.outputs.short_sha }}"

  release-binary:
    name: Cross-compile + sign + publish CLI binaries
    needs: docker-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install gh CLI
        # Pin a known gh version instead of relying on whatever the
        # runner image preinstalls. The "Publish to GitHub Release"
        # step below depends on it (`gh release view/upload/create`).
        # Drop the binary into ~/.local/bin and prepend that to PATH
        # for subsequent steps.
        env:
          GH_VERSION: '2.55.0'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz" \
            | tar xz -C "$HOME/.local"
          mv "$HOME/.local/gh_${GH_VERSION}_linux_amd64/bin/gh" "$HOME/.local/bin/gh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/gh" --version

      - name: Extract semver tag (or dry-run placeholder)
        id: tag
        run: |
          short_sha="${GITHUB_SHA::7}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="dryrun-${short_sha}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Cross-compile metrics-cli (linux/darwin × amd64/arm64)
        env:
          CGO_ENABLED: '0'
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            out="dist/metrics-cli_${TAG}_${goos}_${goarch}"
            echo "==> building ${out}"
            GOOS="${goos}" GOARCH="${goarch}" go build -trimpath \
              -ldflags="-s -w -X main.version=${TAG}" \
              -o "${out}" ./cmd/metrics-cli
          done

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum metrics-cli_* > SHA256SUMS
          cat SHA256SUMS

      - name: Install cosign
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign binaries + SHA256SUMS (cosign sign-blob keyless)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        working-directory: dist
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          set -euo pipefail
          for f in metrics-cli_* SHA256SUMS; do
            echo "==> signing ${f}"
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.cert" \
              --bundle "${f}.cosign.bundle" \
              "${f}"
          done

      - name: Upload artifacts (dry run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries-dryrun
          path: dist/
          retention-days: 7

      - name: Publish to GitHub Release (production)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # Auto-create the Release page if it does not exist yet.
          # This collapses the previous M10 two-step procedure
          # (manual `gh release create` + automated `gh release upload`)
          # into a single workflow-driven path:
          #
          #   - existing release  → `gh release upload --clobber` (idempotent
          #     re-runs after a CI flake; preserves any manual release-notes
          #     edits the maintainer may have made)
          #   - missing release   → `gh release create … --generate-notes` with
          #     all 20 artifacts attached in one shot (4 binaries + SHA256SUMS +
          #     per-artifact .sig / .cert / .cosign.bundle)
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists — uploading via --clobber"
            gh release upload "${TAG}" * --clobber
          else
            echo "Release ${TAG} does not exist yet — creating with assets in one shot"
            gh release create "${TAG}" * \
              --generate-notes \
              --title "${TAG}"
          fi

  update-floating-tag:
    name: Advance vMAJOR floating tag (stable releases only)
    needs: [merge-manifest, release-binary]
    runs-on: ubuntu-latest
    # Only run on tag pushes (not workflow_dispatch from a branch) and
    # only when not in dry-run mode. The decision step below also
    # filters pre-releases (FR-004) and back-port releases (FR-005).
    if: |
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      github.event.inputs.dry_run != 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute major version + advance decision
        id: decide
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          # Skip pre-releases per SemVer 2.0.0 (FR-004).
          # Pre-release tags are vX.Y.Z-<identifier>...; the regex below
          # detects a hyphen-prefixed prerelease suffix at the tail.
          if [[ "${TAG}" =~ -[0-9A-Za-z.-]+$ ]]; then
            echo "skip=prerelease" >> "${GITHUB_OUTPUT}"
            echo "Pre-release ${TAG} — vMAJOR floating tag NOT updated"
            exit 0
          fi
          # Extract MAJOR from a stable vX.Y.Z (the +build suffix is also
          # permitted by SemVer 2.0.0 and treated as stable).
          if [[ ! "${TAG}" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "skip=non-semver" >> "${GITHUB_OUTPUT}"
            echo "Tag ${TAG} does not match v<MAJOR>.<MINOR>.<PATCH>; skipping"
            exit 0
          fi
          MAJOR="${BASH_REMATCH[1]}"
          FLOATING="v${MAJOR}"

          # Back-port guard (FR-005): if vMAJOR already exists on origin
          # and points at a NEWER vX.Y.Z than the just-pushed tag, skip.
          if git ls-remote --exit-code origin "refs/tags/${FLOATING}" >/dev/null 2>&1; then
            CURRENT_SHA="$(git ls-remote origin "refs/tags/${FLOATING}" | awk '{print $1}')"
            # Look for any vMAJOR.MINOR.PATCH tag pointing at the current
            # vMAJOR target. If multiple, pick the largest by sort -V.
            CURRENT_TAG="$(git tag --points-at "${CURRENT_SHA}" "v${MAJOR}.*.*" 2>/dev/null | sort -V | tail -1 || true)"
            if [[ -n "${CURRENT_TAG}" ]]; then
              NEWER="$(printf '%s\n%s\n' "${TAG}" "${CURRENT_TAG}" | sort -V | tail -1)"
              if [[ "${NEWER}" != "${TAG}" ]]; then
                echo "skip=backport" >> "${GITHUB_OUTPUT}"
                echo "Back-port: ${TAG} is older than ${CURRENT_TAG} — vMAJOR NOT updated"
                exit 0
              fi
            fi
          fi

          echo "floating=${FLOATING}" >> "${GITHUB_OUTPUT}"
          echo "Will advance ${FLOATING} → $(git rev-parse HEAD) (= ${TAG})"

      - name: Force-update floating tag
        if: steps.decide.outputs.floating != ''
        env:
          FLOATING: ${{ steps.decide.outputs.floating }}
          TARGET_SHA: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git tag -f "${FLOATING}" "${TARGET_SHA}"
          git push origin --force "refs/tags/${FLOATING}"
          echo "Advanced ${FLOATING} → ${TARGET_SHA} (= ${TAG})"
