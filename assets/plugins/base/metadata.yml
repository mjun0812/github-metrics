name: 🗃️ Base content
category: core
description: |
  Restores the activity / community / repositories summary panels that
  were originally bundled into the upstream `base` chrome. The panels
  read aggregated data from the shared `dataprovider.Provider`
  (Profile + RepositorySummary) — no GraphQL or REST fetching duplication.

  Toggle the whole plugin via `plugin_base`, then opt into individual
  panels via `plugin_base_activity` (activity + community columns) and
  `plugin_base_repositories` (repositories summary column).
supports:
  - user
  - organization
scopes:
  - public_access
inputs:

  plugin_base:
    description: |
      Enable base plugin (master switch for the activity / community
      and repositories summary panels)
    type: boolean
    default: no

  plugin_base_activity:
    description: |
      Render the activity + community panel (commits, PR reviews,
      organizations, sponsoring, starred, watching, ...). Requires
      `plugin_base: yes`.
    type: boolean
    default: no

  plugin_base_repositories:
    description: |
      Render the repositories summary panel (license preference,
      releases, packages, disk usage, sponsors, stargazers, forks,
      watchers). Requires `plugin_base: yes`.
    type: boolean
    default: no
