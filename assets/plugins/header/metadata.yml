name: 🪪 Header card
category: core
description: |
  Identity block: avatar / display name / follower & following counters /
  trailing two-week commit calendar / contributed-to repositories.

  Extracted from the legacy `base` plugin in #602 so the card can be
  embedded standalone in profile READMEs (mjun0812/mjun0812 style)
  without dragging the every-plugin base fetch with it.
examples:
  default: https://github.com/mjun0812/github-metrics/blob/main/docs/examples/plugin-base.svg
index: 1
supports:
  - user
  - organization
scopes:
  - public_access
inputs:

  plugin_header:
    description: |
      Enable header plugin
    type: boolean
    default: no

  plugin_header_indepth:
    description: |
      Indepth mode

      Enabling this will consume additional API queries to fetch more data.
      This currently improves the accuracy of the following statistics:
        - total commits
        - total issues
        - total pull requests
        - total pull requests reviews
        - total repositories contributed to
    type: boolean
    default: no
    extras:
      - metrics.api.github.overuse

  plugin_header_hireable:
    description: |
      Show `Available for hire!` in the header section
    type: boolean
    default: no
