<svg xmlns="http://www.w3.org/2000/svg" width="480" height="62" viewBox="0 0 480 62" class=""><defs><style></style></defs><style data-optimizable="true">/* SVG global context */
  svg {
    font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif, Apple Color Emoji, Segoe UI Emoji;
    font-size: 14px;
    color: #777777;
  }

/* Headers */
  h1, h2, h3 {
    margin: 8px 0 2px;
    padding: 0;
    color: #0366d6;
    font-weight: normal;
  }
  h1 svg, h2 svg, h3 svg {
    fill: currentColor;
  }
  h1 {
    font-size: 20px;
    font-weight: bold;
  }
  h2 {
    font-size: 16px;
  }
  h3 {
    font-size: 14px;
  }
  .h-details {
    margin: 0 4px;
    padding-top: 4px;
    font-size: 0.8rem;
  }

/* Fields */
  section > .field {
    margin-left: 5px;
    margin-right: 5px;
  }
  .field {
    display: flex;
    align-items: center;
    margin-bottom: 2px;
    white-space: nowrap;
  }
  .field.wrap {
    flex-wrap: wrap;
  }
  .field svg {
    margin: 0 8px;
    fill: #959da5;
    flex-shrink: 0;
  }
  /* Pin every octicon SVG to the 16x16 box upstream renders at.
     Without this, an attribute-less octicon placeholder collapses to
     the SVG default viewport (300x150) in Chrome, which made each
     .field row ~150px tall and inflated the base render to upstream *
     5.6. 16x16 matches @primer/octicons defaults so real octicons are
     unaffected. */
  .octicon {
    width: 16px;
    height: 16px;
  }

/* Displays */
  .row {
    display: flex;
    flex-wrap: wrap;
  }
  .row section {
    flex: 1 1 0;
  }
/* Repository template — introduction badges + community / activity stats.
   These horizontal lists are emitted by the repository partials
   (internal/templates/repository/partials). `.row` already gives them
   flex layout; these rules add the inter-item spacing the labels need
   (without it they run together, e.g. "PythonBSD 3-Clause ... Licensemain")
   plus the primary-language colour dot. The selectors are
   repository-only, so the classic CSS purge drops them from user-mode
   renders that have no matching element. */
  .repo-badges .badge {
    display: inline-flex;
    align-items: center;
    margin-right: 14px;
  }
  .repo-badges .badge.language::before {
    content: "";
    display: inline-block;
    width: 10px;
    height: 10px;
    margin-right: 5px;
    border-radius: 50%;
    background-color: var(--lang-color, #959da5);
  }
  .community-stats .stat,
  .activity-stats .stat {
    margin-right: 16px;
  }
  .column {
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .center {
    justify-content: center;
  }
  .horizontal {
    justify-content: space-around;
  }
  .horizontal-wrap {
    flex-wrap: wrap;
  }
  .horizontal .field {
    flex: 1 1 0;
  }
  .margin-bottom {
    margin-bottom: 16px;
  }

/* User avatar */
  .avatar {
    border-radius: 50%;
    margin: 0 6px;
  }

  .organization.avatar {
    border-radius: 15%;
  }

  .organization.name {
    white-space: nowrap;
  }

  .organization.contributions {
    margin: 0 8px;
    flex-wrap: wrap;
  }

  .contribution.organization {
    display: flex;
    /* Vertically center avatar / name / (gauge + icon) so the per-stat
     * icon sits on the gauge's horizontal centerline. Without this the
     * default `align-items: stretch` lets each child anchor to its own
     * baseline and the icons drift below the gauge text. */
    align-items: center;
    border: 1px solid #959da5;
    border-radius: 6px;
    padding: 2px 6px;
    padding-left: 0;
    margin: 2px;
    font-size: 12px;
    background-color: #959da520;
  }
  .contribution.organization.s {
    color: #EB355E;
    background-color: #EB355E26;
    border-color: #EB355E;
  }
  .contribution.organization.a {
    color: #D79533;
    background-color: #E7BD6926;
    border-color: #E7BD69;
  }
  .contribution.organization.b {
    color: #9D8FFF;
    background-color: #9E91FF26;
    border-color: #9E91FF;
  }
  .contribution.organization.c {
    color: #58A6FF;
    background-color: #58A6FF26;
    border-color: #58A6FF;
  }
  .contribution .gauge-base, .contribution .gauge-arc {
    stroke: currentColor;
    stroke-width: 4;
  }
  .contribution .gauge text {
    fill: currentColor;
    font-size: 11px;
  }
  /* Gauge + icon layout (diverges from upstream): upstream scales the
   * 16x16 gauge to ~22.4x22.4 and overlays the icon at
   * margin-left:-9px / margin-top:8px so the icon lands on the gauge's
   * own bottom-right. That overlay covers the gauge's value text —
   * every lowlighter/mjun0812 sample is gauge-less so the regression is
   * invisible upstream, but our indepth sample renders gauges and the
   * overlap is real. Drop scale() so the gauge stays at 16x16 (matching
   * the SVG attributes) and float the icon as a separate sibling to the
   * right of the gauge so the pair reads as "value chip + type marker". */
  .contribution .gauge {
    margin: 0 4px;
    color: inherit;
  }
  .contribution .icon {
    fill: currentColor;
    width: 10px;
    height: 10px;
    margin-left: 2px;
    color: inherit;
    filter: brightness(.5);
  }
  .contribution.s .side {
    background-color: #EB355E26;
  }
  .contribution.a .side {
    background-color: #E7BD6926;
  }
  .contribution.b .side {
    background-color: #9E91FF26;
  }
  .contribution.c .side {
    background-color: #58A6FF26;
  }

  .contribution.organization .avatar {
    margin: 0 4px;
  }

  /* Basic-mode notable chip badge — inline "★ N" star count rendered
     beside the repository name when the gauge cluster is absent (issue
     #422). Keeps the same chip font-size so the count is legible
     instead of crammed into the tiny gauge text. */
  .contribution.organization .stars {
    margin: 0 4px 0 6px;
    white-space: nowrap;
    font-weight: 600;
  }

/* Commit calendar */
  .calendar .day {
    outline: 1px solid rgba(27,31,35,.04);
    outline-offset: -1px;
  }

/* Progress bars */
  svg.bar {
    margin: 4px 0;
  }

/* Language */
  .field.language {
    margin: 0 8px;
    flex-grow: 0;
  }

  .field.language.details {
    display: flex;
    justify-content: space-between;
  }

  .field.language.details small {
    display: flex;
    justify-content: space-between;
    color: #666666;
    text-align: right;
  }

  .field.language.details > *, .field.language.details small > * {
    flex: 1 1 0;
  }
  .field.language.details small > *:not(:last-child) {
    margin-right: 6px;
  }

/* Labels */
  .label {
    background-color: #58A6FF30;
    color: #0366D6;
    padding: 0 10px;
    font-weight: 500;
    line-height: 22px;
    margin: 2px 5px;
    white-space: nowrap;
    border-radius: 32px;
    font-size: 12px;
  }
  .label .label-right {
    display: flex;
    align-items: center;
    font-size: .7rem;
    margin-left: 6px;
    margin-right: -10px;
    background-color: #58A6FF10;
    padding: 0 7px;
    border-top-right-radius: 32px;
    border-bottom-right-radius: 32px;
  }
  .label .twemoji {
    margin-top: .25em;
    margin-left: 0px;
  }

/* Habits */
  .habits .facts {
    margin: 0;
    list-style-type: none;
    padding-left: 37px;
  }

/* Footer */
  footer {
    margin-top: 8px;
    font-size: 10px;
    font-style: italic;
    color: #666666;
    text-align: right;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    width: 440px;
    padding: 0;
    margin-left: auto;
    overflow-wrap: anywhere;
  }

  footer span {
    max-width: 440px;
    /* Keep a half-width-space worth of breathing room between the
     * timestamp/version text and the SVG's right edge so the footer
     * doesn't read as if it were clipped. */
    padding-right: 6px;
  }

/* Speed test categories */
  .categories {
    display: flex;
    align-items: center;
    justify-content: space-around;
    margin-top: 4px;
  }
  .category {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1 1 0;
  }

/* Gauges */
  .gauge {
    stroke-linecap: round;
    fill: none;
  }
  .gauge.info {
    color: #58A6FF;
  }
  .gauge-base, .gauge-arc {
    stroke: currentColor;
    stroke-width: 10;
  }
  .gauge-base {
    stroke-opacity: .2;
  }
  .gauge-arc {
    fill: none;
    stroke-dashoffset: 0;
    animation-delay: 250ms;
    animation: animation-gauge 1s ease forwards
  }
  .gauge text {
    fill: currentColor;
    font-size: 40px;
    font-family: monospace;
    text-anchor: middle;
    font-weight: 600;
  }
  .gauge .title {
    font-size: 18px;
    color: #777777;
  }
  @keyframes animation-gauge {
    from {
      stroke-dasharray: 0 329;
    }
  }

/* Topics */
  .topics {
    display: flex;
    flex-wrap: wrap;
  }

  .topics img {
    border-radius: 5px;
    margin: 4px;
  }

/* Charts and graphs */
  .chart {
    padding: 0 8px;
  }

  .chart-bars {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    width: 100%;
    margin: 8px 0 4px;
    flex-grow: 1;
    min-height: 70px;
  }

  .chart-bars .entry {
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-size: 10px;
    color: #666666;
  }

  .chart-bars .entry .value {
    font-size: 6px;
  }

  .chart-bars .entry .empty {
    width: 100%;
    text-align: center;
  }

  .chart-bars .bar {
    width: 7px;
    background-color: var(--color-calendar-graph-day-bg);
    border: 1px solid var(--color-calendar-graph-day-border);
    border-radius: 5px;
  }

  .chart-bars.horizontal {
    flex-direction: column;
    height: 100%;
  }

  .chart-bars.horizontal .entry {
    align-items: center;
    flex-direction: row;
    width: 100%;
    min-height: 1rem;
  }

  .chart-bars.horizontal .entry .name {
    flex-shrink: 0;
    text-align: right;
    width: 34%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .chart-bars .entry .bottom {
    margin-bottom: -1rem;
    line-height: 1rem;
  }

  .chart-bars.horizontal .bar {
    height: 7px;
    width: auto;
    margin: 0 6px;
  }

/* Repository */
  .repository {
    display: flex;
    flex-direction: column;
    width: 100%;
    margin: 6px 0;
  }

  .repository .name {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 440px;
    gap: 8px;
  }

  .repository .name span:first-child {
    color: #58a6ff;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .repository .name span:last-child {
    color: #666666;
    font-size: 10px;
    flex-shrink: 0;
    max-width: 150px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .repository .name a {
    color: inherit;
    text-decoration: none;
  }

  .repository .description {
    display: block;
    width: 440px;
    white-space: normal;
  }

  .repository .description, .repository .infos {
    color: #666666;
    margin-left: 38px;
    font-size: 13px;
  }

  .repository .infos > div {
    display: flex;
    align-items: center;
    margin-right: 16px;
  }

  .repository .infos svg {
    margin: 0;
    margin-right: 4px;
  }

/* Activity */
  .activity {
    margin-bottom: 12px;
  }

  .activity .field {
    width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 450px;
    white-space: nowrap;
    margin-bottom: 0;
  }

  .activity .field .content {
    flex-grow: 1;
    text-overflow: ellipsis;
    overflow: hidden;
  }

  .activity .repo {
    display: inline;
    color: #58a6ff;
  }

  .activity .code {
    background-color: #7777771F;
    padding: 1px 5px;
    font-size: 80%;
    border-radius: 6px;
    color: #777777;
    font-family: SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace;
    margin: 0 4px -3px;
  }

  .activity .details, .activity .timestamp {
    padding-left: 38px;
    display: flex;
    flex-direction: column;
    font-size: 13px;
    color: #666666;
  }

  .activity .timestamp {
    font-size: 10px;
    margin-top: 4px;
  }

/* Calendar */
  svg.calendar {
    margin-left: 13px;
    margin-top: 4px;
  }

  svg.calendar text {
    font-size: 18px;
    fill: currentColor;
  }

/* People */
  .people {
    padding: 0 10px;
  }

  .people .avatar {
    margin: 0 2px;
  }

/* Star lists */
  .starlist {
    padding-left: 28px;
    width: 460px;
  }
  .starlist > .description, .starlist > .count {
    margin-left: 32px;
  }
  .starlist > .count {
    font-size: 12px;
    color: #666666;
  }
  .starlist .repositories {
    margin-left: -5px;
    margin-bottom: 20px;
  }
  .starlist .repository {
    margin: 6px 0 0;
  }
  .starlist .repository .description {
    font-size: 11px;
  }
  .starlist .repository .name {
    font-size: 14px;
  }
  .starlist .languages {
    margin-top: 6px;
    padding-left: 13px;
  }
  .starlist .languages svg.bar {
    margin-left: 18px;
  }

/* Contributors */
  .contributors {
    display: flex;
    flex-wrap: wrap;
    margin-left: 6px;
  }
  .contributors .label {
    padding-left: 0;
    display: flex;
    align-items: center;
  }
  .contributors .label img {
    margin-left: 0;
  }
  .contributors .contributions {
    display: flex;
    align-items: center;
    font-size: .7rem;
    margin-left: 6px;
    margin-right: -10px;
    background-color: #58A6FF10;
    padding: 0 7px;
    border-top-right-radius: 32px;
    border-bottom-right-radius: 32px;
  }
  .contributors .contributions svg {
    fill: #0366D6;
    margin-left: 4px;
    width: .8rem;
    height: .8rem;
  }

/* Sponsors */
  .sponsors {
    white-space: normal;
    margin: 0 13px 2px;
  }
  .sponsors.goal {
    padding: 6px 8px;
    border-radius: 5px;
    background-color: #7777771F;
  }
  .sponsors .avatar {
    margin: 2px;
  }
  .sponsorships.goal {
    display: flex;
    align-items: center;
  }
  .sponsorships.goal .bold {
    font-weight: bold;
  }
  .sponsorships.goal img {
    width: 38px;
    margin-right: 8px;
  }

/* Achievements */
  .achievement {
    display: flex;
    margin: 4px 0;
  }
  .achievement .icon {
    margin: 0 4px;
    width: 44px;
    height: 44px;
  }
  .achievement .text {
    font-size: 12px;
    color: #666666;
  }
  .achievement .title {
    font-size: 14px;
    color: #58A6FF;
  }
  .achievement .value {
    background-color: #58A6FF26;
  }
  .achievement.x .title {
    color: #666666;
  }
  .achievement.x .value {
    background-color: #B0B0B026;
  }
  .achievement.b .title {
    color: #9D8FFF;
  }
  .achievement.b .value {
    background-color: #9E91FF26;
  }
  .achievement.a .title {
    color: #D79533;
  }
  .achievement.a .value {
    background-color: #E7BD6926;
  }
  .achievement.s .title {
    color: #EB355E;
  }
  .achievement.s .value {
    background-color: #EB355E26;
  }
  .achievement.secret .title{
    color: #FF76CD;
  }
  .achievement.secret .value {
    background-color: #FF79D126;
  }
  .achievement .value {
    border: 1px solid currentColor;
    border-radius: 16px;
    font-size: 10px;
    padding: 0 5px;
    white-space: nowrap;
  }
  .achievement .gauge-base, .achievement .gauge-arc {
    stroke-width: 6;
  }
  .achievement .value-wrapper {
    margin-bottom: -50px;
    margin-top: 36px;
    display: none;
  }
  .achievement .value {
    margin-left: 46px;
  }
  .achievements.compact {
    display: flex;
    flex-wrap: wrap;
  }
  .achievements.compact .achievement {
    flex-direction: column-reverse;
    align-items: center;
    width: 80px;
  }
  .achievements.compact .info {
    width: 100%;
  }
  .achievements.compact .achievement .title {
    margin-bottom: 2px;
    text-transform: capitalize;
    text-align: center;
  }
  .achievements.compact .achievement .title .prefix {
    min-height: 13px;
    font-size: 10px;
    display: block;
    margin-bottom: -.25rem;
  }
  .achievements.compact .achievement .value-wrapper {
    display: flex;
  }
  .achievements.compact .achievement .text {
    display: none;
  }

/* Markdown and syntax highlighting */
  .markdown p {
    margin: 8px 0;
  }
  .markdown a {
    color: #58a6ff;
    text-decoration: none;
  }
  code {
    background-color: #7777771F;
    display: inline-block;
    border-radius: 6px;
    color: #777777;
    padding: 1px 5px;
    font-size: 80%;
    font-family: SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace;
  }
  span.code {
    background-color: #7777771F;
    padding: 1px 5px;
    font-size: 80%;
    border-radius: 6px;
    color: #777777;
    font-family: SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace;
    margin: 0 4px -3px;
  }

/* Twemoji and GitHub emoji */
  .twemoji, .gemoji {
    height: 1em;
    width: 1em;
    margin-bottom: -.125em;
  }

/* Calendar */
  :root {
    --color-calendar-graph-day-bg: #ebedf0;
    --color-calendar-graph-day-border: rgba(27,31,35,0.06);
    --color-calendar-graph-day-L1-bg: #9be9a8;
    --color-calendar-graph-day-L2-bg: #40c463;
    --color-calendar-graph-day-L3-bg: #30a14e;
    --color-calendar-graph-day-L4-bg: #216e39;
    --color-calendar-halloween-graph-day-L1-bg: #ffee4a;
    --color-calendar-halloween-graph-day-L2-bg: #ffc501;
    --color-calendar-halloween-graph-day-L3-bg: #fe9600;
    --color-calendar-halloween-graph-day-L4-bg: #03001c;
    --color-calendar-winter-graph-day-L1-bg: #0a3069;
    --color-calendar-winter-graph-day-L2-bg: #0969da;
    --color-calendar-winter-graph-day-L3-bg: #54aeff;
    --color-calendar-winter-graph-day-L4-bg: #b6e3ff;
    --color-calendar-graph-day-L4-border: rgba(27,31,35,0.06);
    --color-calendar-graph-day-L3-border: rgba(27,31,35,0.06);
    --color-calendar-graph-day-L2-border: rgba(27,31,35,0.06);
    --color-calendar-graph-day-L1-border: rgba(27,31,35,0.06);
  }

/* End delimiter */
  #metrics-end {
    width: 100%;
  }

  .no-animations * {
    transition-delay: 0s !important;
    transition-duration: 0s !important;
    animation-delay: -0.0001s !important;
    animation-duration: 0s !important;
    animation-play-state: paused !important;
    caret-color: transparent !important;
  }
</style><style></style><g transform="translate(0,0)" class="plugin-starlists" data-plugin="starlists"><g data-section="starlists"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="28" viewBox="0 0 480 28"><g transform="translate(13,9)" fill="#959da5"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path fill-rule="evenodd" d="M1.75 2.5a.75.75 0 000 1.5h6.5a.75.75 0 000-1.5h-6.5zm4 5a.75.75 0 000 1.5h7.5a.75.75 0 000-1.5h-7.5zm0 5a.75.75 0 000 1.5h7.5a.75.75 0 000-1.5h-7.5zM3 8a1 1 0 11-2 0 1 1 0 012 0zm-1 6a1 1 0 100-2 1 1 0 000 2z"></path><path d="M13.314 4.918L11.07 2.417A.25.25 0 0111.256 2h4.488a.25.25 0 01.186.417l-2.244 2.5a.25.25 0 01-.372 0z"></path></svg></g><text x="37" y="22" font-size="16" fill="#0366d6">0 Star lists</text></svg></g></g><g transform="translate(0,28)"><g data-section="metadata"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="34" viewBox="0 0 480 34"><text x="474" y="18" font-size="10" fill="#666666" font-style="italic" text-anchor="end">These metrics include private contributions</text><text x="474" y="31" font-size="10" fill="#666666" font-style="italic" text-anchor="end">Last updated 2026-07-08T05:11:47Z with mjun0812/github-metrics@test-version</text></svg></g></g></svg>