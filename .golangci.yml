# golangci-lint configuration for github-metrics (v1 schema).
# See specs/001-project-foundation/research.md §R-008 for the rationale
# behind individual rule choices.

run:
  timeout: 10m
  go: "1.23"
  tests: true
  modules-download-mode: readonly

linters:
  disable-all: true
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
    - revive
    - gofumpt
    - gosec
    - nilerr
    - prealloc
    - unparam

linters-settings:
  gofumpt:
    extra-rules: true
  govet:
    enable:
      - shadow
      - composites
      - copylocks
      - errorsas
      - httpresponse
      - nilness
      - printf
      - unreachable
      - unusedwrite
      - lostcancel
      - structtag
      - assign
      - atomic
      - bools
      - buildtag
      - cgocall
      - directive
      - findcall
      - framepointer
      - ifaceassert
      - loopclosure
      - sigchanyzer
      - slog
      - stringintconv
      - stdmethods
      - testinggoroutine
      - unmarshal
      - unsafeptr
  gosec:
    excludes:
      - G104
  revive:
    rules:
      - name: var-naming
      - name: exported
        arguments:
          - disableStutteringCheck
      - name: package-comments
      - name: error-return
      - name: error-naming
      - name: error-strings
      - name: receiver-naming
      - name: unused-parameter
        disabled: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    - path: _test\.go$
      linters:
        - gosec
        - unparam
    - path: graphql_gen\.go$
      linters:
        - revive
        - gocritic
        - gosec
        - unparam
