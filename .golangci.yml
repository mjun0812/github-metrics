# golangci-lint configuration for github-metrics.
# Ruleset rationale: specs/001-project-foundation/research.md R-008.

run:
  timeout: 10m
  go: "1.23"
  tests: true
  modules-download-mode: readonly

linters:
  disable-all: true
  enable:
    # Correctness
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - nilerr
    # Suggestions
    - gosimple
    - gocritic
    - revive
    - prealloc
    - unparam
    # Style
    - gofumpt
    # Security
    - gosec

linters-settings:
  gofumpt:
    extra-rules: true
  govet:
    enable-all: true
  gosec:
    excludes:
      # G104: errcheck already covers unchecked errors with better targeting.
      - G104
  revive:
    rules:
      - name: var-naming
      - name: exported
      - name: package-comments
      - name: error-return
      - name: error-naming
      - name: error-strings
      - name: receiver-naming
      - name: unused-parameter
        disabled: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    # Test files: relax some rules that are common in fixtures.
    - path: _test\.go$
      linters:
        - gosec
        - unparam
    # Generated code: skip strict rules for files under code-gen output paths.
    - path: graphql_gen\.go$
      linters:
        - revive
        - gocritic
        - gosec
        - unparam

# Disabled linters that we may revisit later (see research R-008):
#   exhaustive, exhaustruct, wrapcheck — high false-positive rate at M1.
