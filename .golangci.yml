# golangci-lint v2 configuration for github-metrics.
# Migrated from the original v1 ruleset (see git log for the v1 form);
# rationale for individual entries is in
# specs/001-project-foundation/research.md §R-008.

version: "2"

run:
  timeout: 10m
  go: "1.23"
  tests: true
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - nilerr
    - gocritic
    - revive
    - prealloc
    - unparam
    - gosec

  settings:
    govet:
      enable:
        - shadow
        - composites
        - copylocks
        - errorsas
        - httpresponse
        - nilness
        - printf
        - unreachable
        - unusedwrite
        - lostcancel
        - structtag
        - assign
        - atomic
        - bools
        - buildtag
        - cgocall
        - directive
        - findcall
        - framepointer
        - ifaceassert
        - loopclosure
        - sigchanyzer
        - slog
        - stringintconv
        - stdmethods
        - testinggoroutine
        - unmarshal
        - unsafeptr
    gosec:
      excludes:
        # G104: errcheck already covers unchecked errors with better targeting.
        - G104
    revive:
      rules:
        - name: var-naming
        - name: exported
          arguments:
            - disableStutteringCheck
        - name: package-comments
        - name: error-return
        - name: error-naming
        - name: error-strings
        - name: receiver-naming
        - name: unused-parameter
          disabled: true

  exclusions:
    rules:
      - path: _test\.go$
        linters:
          - gosec
          - unparam
      - path: graphql_gen\.go$
        linters:
          - revive
          - gocritic
          - gosec
          - unparam

formatters:
  enable:
    - gofumpt
  settings:
    gofumpt:
      extra-rules: true
