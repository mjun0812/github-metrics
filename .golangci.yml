# golangci-lint configuration for github-metrics (v2 schema).
#
# Rationale for individual entries is in
# specs/001-project-foundation/research.md §R-008.
#
# Run locally with `make lint` or via the pre-commit hook
# (.pre-commit-config.yaml). Keep this file in sync with the
# .github/workflows/go-ci.yml pin so local and CI verdicts match.

version: "2"

run:
  timeout: 10m
  go: "1.26"
  tests: true
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - nilerr
    - gocritic
    - revive
    - prealloc
    - unparam
    - gosec

  settings:
    govet:
      enable:
        - shadow
        - composites
        - copylocks
        - errorsas
        - httpresponse
        - nilness
        - printf
        - unreachable
        - unusedwrite
        - lostcancel
        - structtag
        - assign
        - atomic
        - bools
        - buildtag
        - cgocall
        - directive
        - findcall
        - framepointer
        - ifaceassert
        - loopclosure
        - sigchanyzer
        - slog
        - stringintconv
        - stdmethods
        - testinggoroutine
        - unmarshal
        - unsafeptr
    gosec:
      excludes:
        # G104: errcheck already covers unchecked errors with better targeting.
        - G104
    staticcheck:
      # M9 explicit enable of the QF (quick-fix) subset that M6/M7
      # self-reviews surfaced manually (QF1001 De Morgan, QF1003 tagged
      # switch, QF1004 strings.ReplaceAll, etc.). "all" keeps the
      # default checks; the explicit listing prevents accidental
      # regression if defaults change between staticcheck releases.
      checks:
        - "all"
        - "QF1001"
        - "QF1003"
        - "QF1004"
    # gocritic: ifElseChain is already enabled by gocritic's default
    # set in golangci-lint v2; paramTypeCombine is already disabled.
    # No additional gocritic configuration needed for M9 — the
    # existing default set covers the M9 lint surface.
    revive:
      rules:
        - name: var-naming
        - name: exported
          arguments:
            - disableStutteringCheck
        - name: package-comments
        - name: error-return
        - name: error-naming
        - name: error-strings
        - name: receiver-naming
        - name: unused-parameter
          disabled: true

  exclusions:
    rules:
      - path: _test\.go$
        linters:
          - gosec
          - unparam
      - path: graphql_gen\.go$
        linters:
          - revive
          - gocritic
          - gosec
          - unparam

formatters:
  enable:
    - gofumpt
  settings:
    gofumpt:
      extra-rules: true
