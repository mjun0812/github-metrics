# Minimal GitHub GraphQL v4 schema slice consumed by genqlient.
#
# We deliberately do NOT vendor the full upstream introspection dump (~3MB
# and constantly drifting). Instead this file declares only the types
# reachable from the queries under internal/githubapi/queries/. Adding a
# new query is a two-step process:
#   1. extend this schema with the new type / field definitions
#   2. write the .graphql operation under internal/githubapi/queries/
#   3. run `make gen` to regenerate graphql_gen.go
#
# Refreshing against a live GitHub schema is left as a follow-up (T035+;
# `gh api graphql -F query=@introspection.graphql`).

scalar DateTime
scalar URI

type Query {
  user(login: String!): User
  organization(login: String!): Organization
  repository(owner: String!, name: String!): Repository
  rateLimit: RateLimit
  viewer: User
}

type User implements RepositoryOwner {
  databaseId: Int
  id: ID!
  login: String!
  name: String
  location: String
  createdAt: DateTime!
  avatarUrl(size: Int): URI!
  websiteUrl: URI
  twitterUsername: String
  email: String
  bio: String
  company: String
  repositories(
    first: Int
    after: String
    ownerAffiliations: [RepositoryAffiliation!]
    orderBy: RepositoryOrder
  ): RepositoryConnection
  contributionsCollection(from: DateTime, to: DateTime): ContributionsCollection
  starredRepositories(first: Int, orderBy: StarOrder): StarredRepositoryConnection
  followers(first: Int): UserConnection
  following(first: Int): UserConnection
  issues(first: Int): IssueConnectionWithReactions
  issueComments(first: Int): IssueCommentConnection
}

type UserConnection {
  totalCount: Int!
  nodes: [User!]
}

input StarOrder {
  field: StarOrderField!
  direction: OrderDirection!
}

enum StarOrderField {
  STARRED_AT
}

type StarredRepositoryConnection {
  totalCount: Int!
  edges: [StarredRepositoryEdge!]
}

type StarredRepositoryEdge {
  starredAt: DateTime!
  node: Repository!
}

type IssueConnectionWithReactions {
  totalCount: Int!
  nodes: [IssueWithReactions!]
}

type IssueWithReactions {
  reactions: ReactionConnection
}

type IssueCommentConnection {
  totalCount: Int!
  nodes: [IssueCommentWithReactions!]
}

type IssueCommentWithReactions {
  reactions: ReactionConnection
}

type ReactionConnection {
  totalCount: Int!
}

enum RepositoryAffiliation {
  OWNER
  COLLABORATOR
  ORGANIZATION_MEMBER
}

enum OrderDirection {
  ASC
  DESC
}

enum RepositoryOrderField {
  CREATED_AT
  UPDATED_AT
  PUSHED_AT
  NAME
  STARGAZERS
}

input RepositoryOrder {
  field: RepositoryOrderField!
  direction: OrderDirection!
}

type RepositoryConnection {
  totalCount: Int!
  pageInfo: PageInfo!
  nodes: [Repository!]
}

type Repository {
  databaseId: Int
  id: ID!
  name: String!
  nameWithOwner: String!
  description: String
  url: URI!
  isPrivate: Boolean!
  isFork: Boolean!
  isArchived: Boolean!
  pushedAt: DateTime
  updatedAt: DateTime
  stargazerCount: Int!
  forkCount: Int!
  watchers: WatcherConnection
  primaryLanguage: Language
  languages(first: Int): LanguageConnection
  licenseInfo: License
  defaultBranchRef: Ref
  owner: RepositoryOwner!
  issues(states: [IssueState!]): IssueConnection
  pullRequests(states: [PullRequestState!]): PullRequestConnection
}

interface RepositoryOwner {
  login: String!
  avatarUrl(size: Int): URI!
}

type License {
  name: String!
  spdxId: String
}

enum IssueState {
  OPEN
  CLOSED
}

enum PullRequestState {
  OPEN
  CLOSED
  MERGED
}

type LanguageConnection {
  totalCount: Int!
  totalSize: Int!
  edges: [LanguageEdge!]
}

type LanguageEdge {
  size: Int!
  node: Language!
}

type Ref {
  name: String!
  target: GitObject
}

interface GitObject {
  id: ID!
}

type Commit implements GitObject {
  id: ID!
  history(first: Int): CommitHistoryConnection!
}

type Tree implements GitObject {
  id: ID!
}

type Tag implements GitObject {
  id: ID!
}

type Blob implements GitObject {
  id: ID!
}

type CommitHistoryConnection {
  totalCount: Int!
}

type IssueConnection {
  totalCount: Int!
}

type PullRequestConnection {
  totalCount: Int!
}

type Language {
  name: String!
  color: String
}

type WatcherConnection {
  totalCount: Int!
}

type PageInfo {
  hasNextPage: Boolean!
  endCursor: String
}

type Organization implements RepositoryOwner {
  databaseId: Int
  id: ID!
  login: String!
  name: String
  location: String
  createdAt: DateTime!
  avatarUrl(size: Int): URI!
  websiteUrl: URI
  email: String
  description: String
  membersWithRole(first: Int, after: String): OrganizationMemberConnection
  repositories(first: Int, after: String, orderBy: RepositoryOrder): RepositoryConnection
}

type OrganizationMemberConnection {
  totalCount: Int!
  pageInfo: PageInfo!
  nodes: [User!]
}

type ContributionsCollection {
  contributionCalendar: ContributionCalendar!
}

type ContributionCalendar {
  totalContributions: Int!
  weeks: [ContributionCalendarWeek!]!
}

type ContributionCalendarWeek {
  firstDay: String!
  contributionDays: [ContributionCalendarDay!]!
}

type ContributionCalendarDay {
  date: String!
  contributionCount: Int!
  weekday: Int!
  color: String!
}

type RateLimit {
  limit: Int!
  remaining: Int!
  resetAt: DateTime!
  cost: Int!
  used: Int!
  nodeCount: Int!
}
