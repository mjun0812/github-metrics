# Minimal GitHub GraphQL v4 schema slice consumed by genqlient.
#
# We deliberately do NOT vendor the full upstream introspection dump (~3MB
# and constantly drifting). Instead this file declares only the types
# reachable from the queries under internal/githubapi/queries/. Adding a
# new query is a two-step process:
#   1. extend this schema with the new type / field definitions
#   2. write the .graphql operation under internal/githubapi/queries/
#   3. run `make gen` to regenerate graphql_gen.go
#
# Refreshing against a live GitHub schema is left as a follow-up (T035+;
# `gh api graphql -F query=@introspection.graphql`).

scalar DateTime
scalar URI

type Query {
  user(login: String!): User
  organization(login: String!): Organization
  repository(owner: String!, name: String!): Repository
  rateLimit: RateLimit
  viewer: User
}

type User implements RepositoryOwner {
  databaseId: Int
  id: ID!
  login: String!
  name: String
  location: String
  createdAt: DateTime!
  avatarUrl(size: Int): URI!
  websiteUrl: URI
  twitterUsername: String
  email: String
  bio: String
  company: String
  repositories(
    first: Int
    after: String
    ownerAffiliations: [RepositoryAffiliation!]
    orderBy: RepositoryOrder
  ): RepositoryConnection
  contributionsCollection(from: DateTime, to: DateTime): ContributionsCollection
  starredRepositories(first: Int, orderBy: StarOrder): StarredRepositoryConnection
  followers(first: Int): UserConnection
  following(first: Int): UserConnection
  # 429 Phase 1: watching connection. Only `totalCount` is read by the
  # base partial; the full node list is left unfetched.
  watching(first: Int): RepositoryConnection
  issues(first: Int): IssueConnectionWithReactions
  issueComments(first: Int): IssueCommentConnection
  # 013: sponsors / sponsorships / projects / pinned items (viewer-mode)
  sponsorsListing: SponsorsListing
  sponsorshipsAsMaintainer(
    first: Int
    activeOnly: Boolean
    orderBy: SponsorshipOrder
  ): SponsorshipConnection
  sponsorshipsAsSponsor(
    first: Int
    orderBy: SponsorshipOrder
  ): SponsorshipConnection
  projectsV2(first: Int, orderBy: ProjectV2Order): ProjectV2Connection
  pinnedItems(first: Int, types: [PinnableItemType!]): PinnableItemConnection
  # 014: starlists. GitHub exposes the user's starred lists (a.k.a.
  # "starlists") via this connection. We project both the list metadata
  # and the per-list items in a single round-trip.
  lists(first: Int): UserListConnection
  # 429 Phase 2: upstream base.header.ejs "Contributed to N
  # repositories" counter. We only read totalCount; the
  # contributionTypes argument mirrors upstream's explicit
  # `[COMMIT, PULL_REQUEST, ISSUE, REPOSITORY]` set so the number
  # matches what GitHub displays on the user profile.
  repositoriesContributedTo(
    first: Int
    contributionTypes: [RepositoryContributionType!]
  ): RepositoryConnection
}

# 429 Phase 2: contribution-type enum used by
# user.repositoriesContributedTo's contributionTypes argument.
enum RepositoryContributionType {
  COMMIT
  ISSUE
  PULL_REQUEST
  PULL_REQUEST_REVIEW
  REPOSITORY
}

type UserListConnection {
  totalCount: Int!
  nodes: [UserList!]
}

type UserList {
  name: String!
  description: String
  isPrivate: Boolean!
  items(first: Int): UserListItemsConnection
}

type UserListItemsConnection {
  totalCount: Int!
  nodes: [UserListItems!]
}

# Starlist items are a union (Repository today, possibly more later). We
# project only the Repository fragment; non-repo nodes are dropped.
union UserListItems = Repository

type UserConnection {
  totalCount: Int!
  nodes: [User!]
}

input StarOrder {
  field: StarOrderField!
  direction: OrderDirection!
}

enum StarOrderField {
  STARRED_AT
}

type StarredRepositoryConnection {
  totalCount: Int!
  edges: [StarredRepositoryEdge!]
}

type StarredRepositoryEdge {
  starredAt: DateTime!
  node: Repository!
}

type IssueConnectionWithReactions {
  totalCount: Int!
  nodes: [IssueWithReactions!]
}

type IssueWithReactions {
  reactions: ReactionConnection
}

type IssueCommentConnection {
  totalCount: Int!
  nodes: [IssueCommentWithReactions!]
}

type IssueCommentWithReactions {
  reactions: ReactionConnection
}

type ReactionConnection {
  totalCount: Int!
  nodes: [Reaction!]
}

type Reaction {
  content: ReactionContent!
}

enum ReactionContent {
  THUMBS_UP
  THUMBS_DOWN
  LAUGH
  HOORAY
  CONFUSED
  HEART
  ROCKET
  EYES
}

enum RepositoryAffiliation {
  OWNER
  COLLABORATOR
  ORGANIZATION_MEMBER
}

enum OrderDirection {
  ASC
  DESC
}

enum RepositoryOrderField {
  CREATED_AT
  UPDATED_AT
  PUSHED_AT
  NAME
  STARGAZERS
}

input RepositoryOrder {
  field: RepositoryOrderField!
  direction: OrderDirection!
}

type RepositoryConnection {
  totalCount: Int!
  pageInfo: PageInfo!
  nodes: [Repository!]
}

type Repository {
  databaseId: Int
  id: ID!
  name: String!
  nameWithOwner: String!
  description: String
  url: URI!
  isPrivate: Boolean!
  isFork: Boolean!
  isArchived: Boolean!
  pushedAt: DateTime
  updatedAt: DateTime
  stargazerCount: Int!
  forkCount: Int!
  watchers: WatcherConnection
  primaryLanguage: Language
  languages(first: Int): LanguageConnection
  licenseInfo: License
  defaultBranchRef: Ref
  owner: RepositoryOwner!
  issues(states: [IssueState!]): IssueConnection
  pullRequests(states: [PullRequestState!]): PullRequestConnection
  # 013: stargazers chart input
  stargazers(first: Int, orderBy: StarOrder): StargazerConnection
  # 429 Phase 2: repository-aggregate fields surfaced by upstream
  # base.repositories.ejs. diskUsage is reported in KB by GitHub
  # GraphQL. releases / packages expose only totalCount in this
  # project so we keep the connection types minimal.
  diskUsage: Int
  releases: ReleaseConnection
  packages(first: Int): PackageConnection
}

interface RepositoryOwner {
  login: String!
  avatarUrl(size: Int): URI!
}

type License {
  name: String!
  spdxId: String
  # 429 Phase 2: stable identifier used by aggregation logic when
  # multiple repos report the same license. `key` is the short SPDX-ish
  # slug GitHub returns (e.g. "mit", "apache-2.0").
  key: String
}

# 429 Phase 2: Release + Package connections. Only totalCount is read.
type ReleaseConnection {
  totalCount: Int!
}

type PackageConnection {
  totalCount: Int!
}

enum IssueState {
  OPEN
  CLOSED
}

enum PullRequestState {
  OPEN
  CLOSED
  MERGED
}

type LanguageConnection {
  totalCount: Int!
  totalSize: Int!
  edges: [LanguageEdge!]
}

type LanguageEdge {
  size: Int!
  node: Language!
}

type Ref {
  name: String!
  target: GitObject
}

interface GitObject {
  id: ID!
}

type Commit implements GitObject {
  id: ID!
  history(first: Int): CommitHistoryConnection!
}

type Tree implements GitObject {
  id: ID!
}

type Tag implements GitObject {
  id: ID!
}

type Blob implements GitObject {
  id: ID!
}

type CommitHistoryConnection {
  totalCount: Int!
}

type IssueConnection {
  totalCount: Int!
}

type PullRequestConnection {
  totalCount: Int!
}

type Language {
  name: String!
  color: String
}

type WatcherConnection {
  totalCount: Int!
}

type PageInfo {
  hasNextPage: Boolean!
  endCursor: String
}

type Organization implements RepositoryOwner {
  databaseId: Int
  id: ID!
  login: String!
  name: String
  location: String
  createdAt: DateTime!
  avatarUrl(size: Int): URI!
  websiteUrl: URI
  email: String
  description: String
  membersWithRole(first: Int, after: String): OrganizationMemberConnection
  repositories(first: Int, after: String, orderBy: RepositoryOrder): RepositoryConnection
}

type OrganizationMemberConnection {
  totalCount: Int!
  pageInfo: PageInfo!
  nodes: [User!]
}

type ContributionsCollection {
  contributionCalendar: ContributionCalendar!
}

type ContributionCalendar {
  totalContributions: Int!
  weeks: [ContributionCalendarWeek!]!
}

type ContributionCalendarWeek {
  firstDay: String!
  contributionDays: [ContributionCalendarDay!]!
}

type ContributionCalendarDay {
  date: String!
  contributionCount: Int!
  weekday: Int!
  color: String!
}

type RateLimit {
  limit: Int!
  remaining: Int!
  resetAt: DateTime!
  cost: Int!
  used: Int!
  nodeCount: Int!
}

# ===== 013: sponsors / sponsorships / projects / pinned / stargazers =====

type SponsorsListing {
  shortDescription: String!
  fullDescription: String!
  activeGoal: SponsorsGoal
}

type SponsorsGoal {
  title: String
  description: String
  kind: SponsorsGoalKind!
  percentComplete: Int!
}

enum SponsorsGoalKind {
  TOTAL_SPONSORS_COUNT
  MONTHLY_SPONSORSHIP_AMOUNT
}

input SponsorshipOrder {
  field: SponsorshipOrderField!
  direction: OrderDirection!
}

enum SponsorshipOrderField {
  CREATED_AT
}

type SponsorshipConnection {
  totalCount: Int!
  nodes: [Sponsorship!]
}

type Sponsorship {
  createdAt: DateTime!
  isActive: Boolean!
  # The maintainer being sponsored (used by sponsorshipsAsSponsor).
  sponsorable: Sponsorable
  # The party providing the sponsorship (used by sponsorshipsAsMaintainer).
  sponsorEntity: Sponsor
}

# Union-like — we project __typename so genqlient can route to the right
# fragment in our queries (User vs Organization).
union Sponsorable = User | Organization
union Sponsor = User | Organization

input ProjectV2Order {
  field: ProjectV2OrderField!
  direction: OrderDirection!
}

enum ProjectV2OrderField {
  UPDATED_AT
  CREATED_AT
  TITLE
  NUMBER
}

type ProjectV2Connection {
  totalCount: Int!
  nodes: [ProjectV2!]
}

type ProjectV2 {
  title: String!
  shortDescription: String
  updatedAt: DateTime!
  url: URI!
  closed: Boolean!
  number: Int!
}

enum PinnableItemType {
  REPOSITORY
  GIST
}

type PinnableItemConnection {
  totalCount: Int!
  nodes: [PinnableItem!]
}

# Pinnable items are a union of Repository | Gist. We only fetch
# Repository fragments — Gist nodes are skipped.
union PinnableItem = Repository | Gist

type Gist {
  name: String!
}

type StargazerConnection {
  totalCount: Int!
  edges: [StargazerEdge!]
}

type StargazerEdge {
  starredAt: DateTime!
  node: User!
}
