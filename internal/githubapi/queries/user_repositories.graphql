query UserRepositories($login: String!, $first: Int!, $after: String) {
  user(login: $login) {
    repositories(
      first: $first
      after: $after
      ownerAffiliations: [OWNER]
      orderBy: { field: UPDATED_AT, direction: DESC }
    ) {
      totalCount
      pageInfo {
        hasNextPage
        endCursor
      }
      nodes {
        databaseId
        id
        name
        nameWithOwner
        description
        url
        isPrivate
        isFork
        pushedAt
        updatedAt
        stargazerCount
        forkCount
        watchers {
          totalCount
        }
        primaryLanguage {
          name
          color
        }
        languages(first: 8) {
          totalCount
          totalSize
          edges {
            size
            node {
              name
              color
            }
          }
        }
        # 429 Phase 2: aggregate fields rendered by upstream
        # base.repositories.ejs. diskUsage is reported in KB by
        # GitHub GraphQL. Releases / packages expose only totalCount;
        # licenseInfo can be null for repos with no LICENSE file.
        diskUsage
        releases {
          totalCount
        }
        packages(first: 0) {
          totalCount
        }
        licenseInfo {
          name
          key
        }
      }
    }
  }
}
