query ViewerPinnedItems($first: Int!) {
  viewer {
    pinnedItems(first: $first, types: [REPOSITORY]) {
      totalCount
      nodes {
        __typename
        ... on Repository {
          nameWithOwner
          description
          url
          isPrivate
          isFork
          createdAt
          stargazerCount
          forkCount
          issues(states: OPEN) {
            totalCount
          }
          pullRequests(states: OPEN) {
            totalCount
          }
          licenseInfo {
            name
            spdxId
            nickname
          }
          primaryLanguage {
            name
            color
          }
        }
      }
    }
  }
}
