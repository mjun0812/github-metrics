query OrganizationRepositories($login: String!, $first: Int!, $after: String) {
  organization(login: $login) {
    repositories(
      first: $first
      after: $after
      orderBy: { field: UPDATED_AT, direction: DESC }
    ) {
      totalCount
      pageInfo {
        hasNextPage
        endCursor
      }
      nodes {
        databaseId
        id
        name
        nameWithOwner
        description
        url
        isPrivate
        isFork
        createdAt
        pushedAt
        updatedAt
        stargazerCount
        forkCount
        # #466: per-card issue / PR counters rendered by the repositories
        # plugin's info row (upstream repositories.ejs).
        issues {
          totalCount
        }
        pullRequests {
          totalCount
        }
        watchers {
          totalCount
        }
        primaryLanguage {
          name
          color
        }
        languages(first: 8) {
          totalCount
          totalSize
          edges {
            size
            node {
              name
              color
            }
          }
        }
        # 429 Phase 2: aggregate fields rendered by upstream
        # base.repositories.ejs. Mirrors the user_repositories.graphql
        # extension so the organisation render path produces the same
        # Computed.Repositories.{Releases,Packages,DiskUsage,License...}
        # aggregates.
        diskUsage
        releases {
          totalCount
        }
        packages(first: 0) {
          totalCount
        }
        # achievements: mirrors the user_repositories.graphql extension
        # so the organisation render path produces the same
        # Computed.Repositories.Deployments aggregate.
        deployments {
          totalCount
        }
        licenseInfo {
          name
          key
          nickname
          spdxId
        }
      }
    }
  }
}
