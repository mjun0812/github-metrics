query UserStarredRepositories($login: String!, $first: Int!) {
  user(login: $login) {
    starredRepositories(first: $first, orderBy: { field: STARRED_AT, direction: DESC }) {
      totalCount
      edges {
        starredAt
        node {
          nameWithOwner
          description
          url
          isFork
          stargazerCount
          forkCount
          primaryLanguage {
            name
            color
          }
          licenseInfo {
            name
            spdxId
          }
          issues {
            totalCount
          }
          pullRequests {
            totalCount
          }
        }
      }
    }
  }
}
