query ViewerNotable($first: Int!) {
  viewer {
    repositories(
      first: $first
      ownerAffiliations: [OWNER]
      orderBy: { field: STARGAZERS, direction: DESC }
    ) {
      totalCount
      nodes {
        nameWithOwner
        description
        url
        owner {
          login
          avatarUrl(size: 64)
        }
        stargazerCount
        forkCount
        isFork
        isPrivate
        defaultBranchRef {
          target {
            __typename
            ... on Commit {
              history(first: 0) {
                totalCount
              }
            }
          }
        }
        issues {
          totalCount
        }
        pullRequests {
          totalCount
        }
      }
    }
  }
}
