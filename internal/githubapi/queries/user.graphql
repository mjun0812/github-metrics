query User($login: String!) {
  user(login: $login) {
    databaseId
    id
    login
    name
    location
    createdAt
    avatarUrl
    websiteUrl
    twitterUsername
    email
    bio
    company
    # 429 Phase 1: foundational header / repositories counters surfaced
    # by upstream base.header.ejs / base.repositories.ejs.
    followers(first: 0) {
      totalCount
    }
    following(first: 0) {
      totalCount
    }
    watching(first: 0) {
      totalCount
    }
    sponsorshipsAsMaintainer(first: 0, activeOnly: true) {
      totalCount
    }
    # 442: Community-stats counters surfaced by upstream
    # base.activity+community.ejs. "Member of N organizations" /
    # "Sponsoring N repositories" / "Starred N repositories" — the
    # remaining community rows (following / watching) reuse the
    # connections already declared above.
    organizations(first: 0) {
      totalCount
    }
    sponsorshipsAsSponsor(first: 0, activeOnly: true) {
      totalCount
    }
    starredRepositories(first: 0) {
      totalCount
    }
    # 442: Activity-section "issue comments" counter. The remaining
    # activity counters (commits / PRs reviewed / PRs opened / issues
    # opened) come from the contributionsCollection aggregate fields
    # added below.
    issueComments(first: 0) {
      totalCount
    }
    # achievements: 18-upstream-achievements rewrite. Surfaces the
    # totals required by the Gister / Chatter / Helper badges (see
    # internal/plugins/achievements/achievements.go). Each connection
    # is requested at first: 0 so only the counter is fetched.
    gists(first: 0) {
      totalCount
    }
    discussionsStarted: repositoryDiscussions(first: 0) {
      totalCount
    }
    discussionsComments: repositoryDiscussionComments(first: 0) {
      totalCount
    }
    discussionAnswers: repositoryDiscussionComments(first: 0, onlyAnswers: true) {
      totalCount
    }
    # 429 Phase 2: "Contributed to N repositories" counter rendered by
    # upstream base.header.ejs. Explicit contributionTypes mirrors
    # upstream's set so the number matches the GitHub profile page.
    repositoriesContributedTo(
      first: 0
      contributionTypes: [COMMIT, PULL_REQUEST, ISSUE, REPOSITORY]
    ) {
      totalCount
    }
    # 429 Phase 3: contribution calendar fetched unconditionally so the
    # BaseHeader mini grid renders even when no indepth-dependent plugin
    # (calendar / isocalendar / habits / repositories.pinned) is
    # enabled. The full year (~53 weeks) is returned; the BaseHeader
    # partial slices the last 11 weeks for the mini grid. Kept separate
    # from `runIndepth` so base no longer needs another plugin enabled
    # to surface this field.
    contributionsCollection {
      # 442: Activity-section aggregate counters rendered by upstream
      # base.activity+community.ejs ("N Commits / N Pull requests
      # reviewed / N Pull requests opened / N Issues opened"). These
      # are the lifetime contributionsCollection totals (the default
      # window with no from/to is the trailing year on the GitHub API,
      # matching upstream's base run which omits from/to as well).
      totalCommitContributions
      totalPullRequestReviewContributions
      totalPullRequestContributions
      totalIssueContributions
      contributionCalendar {
        totalContributions
        weeks {
          firstDay
          contributionDays {
            date
            contributionCount
            weekday
            color
          }
        }
      }
    }
  }
}
