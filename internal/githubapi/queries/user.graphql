query User($login: String!) {
  user(login: $login) {
    databaseId
    id
    login
    name
    location
    createdAt
    avatarUrl
    websiteUrl
    twitterUsername
    email
    bio
    company
    # 429 Phase 1: foundational header / repositories counters surfaced
    # by upstream base.header.ejs / base.repositories.ejs.
    followers(first: 0) {
      totalCount
    }
    following(first: 0) {
      totalCount
    }
    watching(first: 0) {
      totalCount
    }
    sponsorshipsAsMaintainer(first: 0, activeOnly: true) {
      totalCount
    }
    # 429 Phase 2: "Contributed to N repositories" counter rendered by
    # upstream base.header.ejs. Explicit contributionTypes mirrors
    # upstream's set so the number matches the GitHub profile page.
    repositoriesContributedTo(
      first: 0
      contributionTypes: [COMMIT, PULL_REQUEST, ISSUE, REPOSITORY]
    ) {
      totalCount
    }
    # 429 Phase 3: contribution calendar fetched unconditionally so the
    # BaseHeader mini grid renders even when no indepth-dependent plugin
    # (calendar / isocalendar / habits / repositories.pinned) is
    # enabled. The full year (~53 weeks) is returned; the BaseHeader
    # partial slices the last 11 weeks for the mini grid. Kept separate
    # from `runIndepth` so base no longer needs another plugin enabled
    # to surface this field.
    contributionsCollection {
      contributionCalendar {
        totalContributions
        weeks {
          firstDay
          contributionDays {
            date
            contributionCount
            weekday
            color
          }
        }
      }
    }
  }
}
