query UserReactions($login: String!, $issuesFirst: Int!, $commentsFirst: Int!) {
  user(login: $login) {
    issues(first: $issuesFirst) {
      totalCount
      nodes {
        reactions {
          totalCount
          nodes {
            content
          }
        }
      }
    }
    issueComments(first: $commentsFirst) {
      totalCount
      nodes {
        reactions {
          totalCount
          nodes {
            content
          }
        }
      }
    }
  }
}
